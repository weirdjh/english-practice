<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>English Practice</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#202b3b}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:32px 18px 80px}h1{font-size:29px;letter-spacing:-.04em;margin:0 0 7px}header p{color:#6e7b8c;margin:0 0 23px;line-height:1.5}input,select{font:inherit;border:1px solid #dce3ed;background:white;border-radius:10px;padding:11px;color:#27313f}input{width:100%}select{font-size:13px;max-width:100%}input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a7bce8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.count{font-size:12px;color:#818894;margin:14px 0}.entry{background:white;border:1px solid #e0e7ef;border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 3px 12px #1a355006}.entry[open]{border-color:#adc5e5}.entry summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:19px;min-height:100px}.entry summary::-webkit-details-marker{display:none}.front{flex:1;min-width:0}.meta{font-size:11px;color:#8894a4;margin-bottom:10px}.korean{font-size:17px;font-weight:550;line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}.chevron{color:#7288a5;font-size:21px;transition:transform .18s}.entry[open] .chevron{transform:rotate(180deg)}.answer{padding:0 19px 20px;border-top:1px solid #edf0f4}.field{margin-top:18px}.label{font-size:11px;font-weight:750;letter-spacing:.06em;color:#6f829b;text-transform:uppercase;margin-bottom:7px}.value{font-size:15px;line-height:1.7;overflow-wrap:anywhere}.model{background:#f0f6ff;border-left:3px solid #4380d8;padding:13px 14px;border-radius:0 9px 9px 0;font-weight:550}.original{color:#777f8c}.corrected{font-weight:650;color:#1c654b}.note{font-size:14px;line-height:1.7;color:#5f6d7f}.explanation{margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4}.emphasis{background:#fff0bc;color:#81550b;border-radius:3px;padding:1px 3px;font-weight:750}.empty{color:#858c97;padding:30px 0}footer{font-size:12px;color:#9299a5;margin-top:30px}@media(max-width:420px){main{padding-top:24px}.entry summary{padding:16px}.answer{padding:0 16px 18px}}
</style></head><body><main><header><h1>English Practice</h1><p>Translate the two Korean sentences aloud, then tap the card to compare and learn.</p></header><input id="search" type="search" placeholder="Search sentences and grammar points…" aria-label="Search sentences"><div class="filters"><select id="tag" aria-label="Filter by grammar tag"><option value="">All grammar points</option></select><select id="sort" aria-label="Sort by date"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="count" class="count"></div><div id="entries"></div><footer>Older cards have no verified original added date. Tags are used for filtering, not shown on collapsed cards.</footer></main><script>
const cards=[{"id":"legacy-001","date":null,"tags":["Articles","Prepositions","Sentence linking"],"title":"Creating a repository","original":"All right, I made new repository to my account.","corrected":"All right, I've created a new repository under my account.","example":"I created a new repository under my account. Since I want to practice English regularly, I'll use it to store my study notes.","ko":"새 저장소를 제 계정에 만들었어요.","exampleKo":"제 계정에 새 저장소를 만들었어요. 영어를 꾸준히 연습하고 싶어서 그곳에 학습 노트를 저장할 거예요.","why":"A singular countable noun needs an article: 'a new repository'. We usually say a repository is created 'under' an account. In the two-sentence practice example, 'Since' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Since"},{"id":"legacy-002","date":null,"tags":["Plural nouns","Sentence structure","Sentence linking"],"title":"Checking permissions","original":"I've updated permission, can you check again?","corrected":"I've updated the permissions. Could you check again?","example":"I've updated the repository permissions. Could you check again and let me know whether you can access it?","ko":"권한을 업데이트했어요. 다시 확인해 주시겠어요?","exampleKo":"저장소 권한을 업데이트했어요. 다시 확인해 보고 접근할 수 있는지 알려주시겠어요?","why":"Use plural 'permissions' for access settings. Separate the two independent clauses with a period rather than a comma. In the two-sentence practice example, 'whether' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"whether"},{"id":"legacy-003","date":null,"tags":["Articles","Natural phrasing","Sentence linking"],"title":"Checking account identity","original":"I don't think it's on right name. Can you check again?","corrected":"I don't think that's the correct username. Could you double-check which GitHub account is connected?","example":"I don't think that's the correct username. Could you double-check the connected account before making any changes?","ko":"올바른 사용자 이름이 아닌 것 같아요. 연결된 계정을 다시 확인해 주시겠어요?","exampleKo":"그건 올바른 사용자 이름이 아닌 것 같아요. 변경하기 전에 연결된 계정을 다시 확인해 주시겠어요?","why":"'Username' precisely describes a GitHub login. 'Double-check' is natural when requesting verification. In the two-sentence practice example, 'before' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"before"},{"id":"legacy-004","date":null,"tags":["Uncountable nouns","Prepositions","Sentence linking"],"title":"Sharing information","original":"How can I give you an information of my account?","corrected":"How can I share my account information with you?","example":"I'd like to share my account information with you. However, I'm not sure which details you actually need.","ko":"계정 정보를 어떻게 공유하면 될까요?","exampleKo":"제 계정 정보를 공유하고 싶어요. 하지만 어떤 정보가 실제로 필요한지 잘 모르겠어요.","why":"'Information' is uncountable, so don't use 'an'. The natural expression is 'share information with someone'. In the two-sentence practice example, 'However' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"However"},{"id":"legacy-005","date":null,"tags":["Prepositions","Verb patterns","Sentence linking"],"title":"Discussing a project","original":"I'd like to discuss about my personal small project working in my codex.","corrected":"I'd like to talk about a small personal project I've been working on using Codex.","example":"I've been working on a small personal project using Codex. Although it's still in an early stage, I'd like to discuss how to improve it.","ko":"Codex로 진행 중인 작은 개인 프로젝트에 대해 이야기하고 싶어요.","exampleKo":"Codex를 사용해 작은 개인 프로젝트를 진행하고 있어요. 아직 초기 단계이지만 개선 방법을 논의하고 싶어요.","why":"Use 'discuss a project' or 'talk about a project', not 'discuss about'. Say 'work on a project'. In the two-sentence practice example, 'Although' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Although"},{"id":"legacy-006","date":null,"tags":["Prepositions","Natural phrasing","Sentence linking"],"title":"Storing source code","original":"The code is inside my laptop and my GitHub project.","corrected":"The source code is stored both on my laptop and in a GitHub repository.","example":"The source code is stored both on my laptop and in a GitHub repository. That way, I can continue working even when I'm away from my desk.","ko":"소스 코드가 노트북과 GitHub 저장소 양쪽에 있어요.","exampleKo":"소스 코드는 노트북과 GitHub 저장소 양쪽에 있어요. 그래서 책상 앞에 있지 않을 때도 작업을 이어갈 수 있어요.","why":"Files are 'on' a laptop, and a GitHub code project is more precisely called a 'repository'. In the two-sentence practice example, 'That way' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"That way"},{"id":"legacy-007","date":null,"tags":["Prepositions","Verb patterns","Sentence linking"],"title":"Developing on mobile","original":"Can you develop with just chatting in mobile?","corrected":"Can you help me develop the project just by chatting with me on my phone?","example":"I'd like to develop my project by chatting on my phone. If the repository is connected, could you help me make changes remotely?","ko":"휴대폰에서 채팅만으로 프로젝트 개발을 도와줄 수 있나요?","exampleKo":"휴대폰에서 채팅으로 프로젝트를 개발하고 싶어요. 저장소가 연결되어 있다면 원격으로 수정하는 일을 도와주시겠어요?","why":"Say 'on my phone', not 'in mobile'. 'Help me develop the project' specifies the action. In the two-sentence practice example, 'If' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"If"},{"id":"legacy-008","date":null,"tags":["Natural phrasing","Sentence linking"],"title":"Choosing visibility","original":"I think public is also fine.","corrected":"I'm fine with making the repository public, too.","example":"I'm fine with making the repository public. However, I'd like to make sure it doesn't contain any private information.","ko":"저장소를 공개로 만들어도 괜찮아요.","exampleKo":"저장소를 공개로 만들어도 괜찮아요. 다만 개인 정보가 들어 있지 않은지 확인하고 싶어요.","why":"Your original sentence is understandable. Naming 'the repository' makes your meaning more specific. In the two-sentence practice example, 'However' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"However"},{"id":"legacy-009","date":null,"tags":["Articles","Natural phrasing","Sentence linking"],"title":"Requesting study features","original":"You should show me an original sentence and corrected sentence and other example sentence.","corrected":"I'd like you to show my original sentence, a corrected version, and another example sentence.","example":"I'd like to see my original sentence alongside a corrected version. That way, I can understand what changed and why.","ko":"제가 말한 원문, 교정된 문장, 추가 예문을 보여주세요.","exampleKo":"제가 말한 원문과 교정된 문장을 나란히 보고 싶어요. 그러면 무엇이 왜 바뀌었는지 이해할 수 있어요.","why":"Use parallel noun phrases and articles: 'my original sentence, a corrected version, and another example sentence'. In the two-sentence practice example, 'That way' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"That way"},{"id":"legacy-010","date":null,"tags":["Articles","Polite requests","Sentence linking"],"title":"Requesting a repository upload","original":"Okay then, can you upload HTML page to this repository?","corrected":"Okay, could you upload the HTML page to this repository?","example":"Could you upload the HTML page to this repository? Once it's deployed, I'll check whether it works on my phone.","ko":"HTML 페이지를 이 저장소에 업로드해 주시겠어요?","exampleKo":"HTML 페이지를 이 저장소에 업로드해 주시겠어요? 배포되면 휴대폰에서 작동하는지 확인할게요.","why":"Use 'the HTML page' when referring to a specific page. 'Could you' is a polite, natural request. In the two-sentence practice example, 'Once' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Once"},{"id":"legacy-011","date":null,"tags":["Articles","Pronouns","Sentence linking"],"title":"Finding settings","original":"I couldn't find any GitHub Pages settings. Where can I find the setting page?","corrected":"I couldn't find the GitHub Pages settings. Where can I find them?","example":"I couldn't find the GitHub Pages settings. Could you show me where they are so I can publish the website?","ko":"GitHub Pages 설정을 찾을 수 없었어요. 어디에 있나요?","exampleKo":"GitHub Pages 설정을 찾을 수 없었어요. 웹사이트를 게시할 수 있도록 설정 위치를 알려주시겠어요?","why":"Use 'the' for a specific settings section. 'Them' refers naturally to the plural noun 'settings'. In the two-sentence practice example, 'so' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"so"},{"id":"legacy-012","date":null,"tags":["Prepositions","Verb patterns","Sentence linking"],"title":"Confirming deployment","original":"I checked the, I checked. I can access to the page.","corrected":"I checked, and I can access the page now.","example":"I checked the website, and I can access it now. Although the page loads correctly, I still want to test the buttons.","ko":"확인해 봤는데 이제 페이지에 접속할 수 있어요.","exampleKo":"웹사이트를 확인했고 이제 접속할 수 있어요. 페이지는 제대로 열리지만 버튼도 테스트해 보고 싶어요.","why":"'Access' is a transitive verb, so say 'access the page', not 'access to the page'. Remove repeated words in polished writing. In the two-sentence practice example, 'Although' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Although"},{"id":"legacy-013","date":null,"tags":["Natural phrasing","Useful expressions","Sentence linking"],"title":"Expressing appreciation","original":"Thank you for your effort.","corrected":"Thanks for your help. I really appreciate it.","example":"Thanks for your help with the website. I really appreciate it because it makes my English practice much easier.","ko":"도와주셔서 감사합니다. 정말 감사해요.","exampleKo":"웹사이트 작업을 도와주셔서 감사합니다. 덕분에 영어 연습이 훨씬 쉬워져서 정말 감사해요.","why":"'Thank you for your effort' is grammatical, but 'Thanks for your help' or 'I appreciate your help' sounds warmer and more idiomatic. In the two-sentence practice example, 'because' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"because"},{"id":"legacy-014","date":null,"tags":["Countable nouns","Quantifiers","Sentence linking"],"title":"Requesting all corrections","original":"There are much more corrections in this session.","corrected":"There are many more corrections from this conversation.","example":"There are many more corrections from our conversation. Since I want to review them later, I'd like to keep them all in one place.","ko":"이 대화에는 더 많은 교정 문장이 있어요.","exampleKo":"우리 대화에는 교정 문장이 훨씬 더 많아요. 나중에 복습하고 싶어서 모두 한곳에 모아두고 싶어요.","why":"Use 'many' with countable plural nouns such as 'corrections'; use 'much' with uncountable nouns. In the two-sentence practice example, 'Since' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Since"},{"id":"legacy-015","date":null,"tags":["Natural phrasing","Word choice","Sentence linking"],"title":"Comparing recent and older content","original":"However I can find very recent conversations.","corrected":"However, I can only find corrections from our most recent conversations.","example":"I can only find corrections from our most recent conversations. However, I'd also like to review the mistakes I made earlier.","ko":"하지만 최근 대화의 교정 내용만 찾을 수 있어요.","exampleKo":"최근 대화에서 교정한 문장만 찾을 수 있어요. 하지만 이전에 했던 실수도 복습하고 싶어요.","why":"'Only' communicates the missing older material. 'Corrections from conversations' is more precise than 'find conversations'. In the two-sentence practice example, 'However' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"However"},{"id":"legacy-016","date":null,"tags":["Natural phrasing","Verb patterns","Sentence linking"],"title":"Requesting a complete update","original":"I'd like you to update full corrections to the page.","corrected":"I'd like you to add all the corrections from our conversation to the page.","example":"Please add all the corrections from our conversation to the page. That way, I won't have to search through old messages when I study.","ko":"우리 대화에서 교정한 모든 문장을 페이지에 추가해 주세요.","exampleKo":"우리 대화에서 교정한 문장을 모두 페이지에 추가해 주세요. 그러면 공부할 때 예전 메시지를 뒤질 필요가 없어요.","why":"Use 'add ... to the page' for new entries. 'All the corrections' is more idiomatic than 'full corrections'. In the two-sentence practice example, 'That way' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"That way"},{"id":"legacy-017","date":null,"tags":["Adverbs","Verb patterns","Sentence linking"],"title":"Studying more efficiently","original":"In order to study more efficient, I want some features that hiding Korean or English.","corrected":"To study more efficiently, I'd like a feature that lets me hide either the Korean or the English text.","example":"I'd like to study more efficiently by hiding the English text. When I see only the Korean translation, I can try to produce the English sentence myself.","ko":"더 효율적으로 공부하려고 한국어나 영어를 숨길 수 있는 기능이 필요해요.","exampleKo":"영어 문장을 숨겨서 더 효율적으로 공부하고 싶어요. 한국어 번역만 보이면 영어 문장을 직접 만들어 볼 수 있어요.","why":"'Efficiently' is the adverb modifying 'study'. Say 'a feature that lets me hide' rather than 'features that hiding'. In the two-sentence practice example, 'When' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"When"},{"id":"legacy-018","date":null,"tags":["Articles","Word forms","Sentence linking"],"title":"Korean-only practice","original":"If I click show only Korean button, then I can only check Korean version, Korean translate.","corrected":"If I tap the 'Korean only' button, I want to see only the Korean translations.","example":"If I tap the Korean-only button, I want to see only the translations. Then I can check my answer after trying to say it aloud.","ko":"'한국어만 보기' 버튼을 누르면 한국어 번역만 보이게 하고 싶어요.","exampleKo":"한국어만 보기 버튼을 누르면 번역만 보고 싶어요. 그러면 소리 내어 말해 본 뒤 정답을 확인할 수 있어요.","why":"Use 'tap' for mobile buttons. 'Korean translations' is more natural than 'Korean translate'. In the two-sentence practice example, 'Then' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Then"},{"id":"legacy-019","date":null,"tags":["Articles","Useful expressions","Sentence linking"],"title":"Creating English from prompts","original":"And I can make English sentence with leading Korean.","corrected":"Then I can try to make an English sentence using the Korean translation as a prompt.","example":"I can use the Korean translation as a prompt to make an English sentence. Even if I make mistakes, trying it myself helps me learn.","ko":"그러면 한국어 번역을 힌트로 영어 문장을 만들어 볼 수 있어요.","exampleKo":"한국어 번역을 힌트로 영어 문장을 만들 수 있어요. 실수하더라도 직접 시도하는 것이 학습에 도움이 돼요.","why":"Say 'an English sentence' (article required) and 'using ... as a prompt' rather than 'with leading Korean'. In the two-sentence practice example, 'Even if' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Even if"},{"id":"legacy-020","date":null,"tags":["Articles","Prepositions","Sentence linking"],"title":"Connecting GitHub","original":"I'm now having trouble connecting GitHub plugin in ChatGPT.","corrected":"I'm having trouble connecting the GitHub plugin to ChatGPT.","example":"I'm having trouble connecting the GitHub plugin to ChatGPT. Could you help me figure out what's wrong before I try again?","ko":"ChatGPT에 GitHub 플러그인을 연결하는 데 문제가 있어요.","exampleKo":"ChatGPT에 GitHub 플러그인을 연결하는 데 문제가 있어요. 다시 시도하기 전에 원인을 찾는 걸 도와주시겠어요?","why":"'Connect A to B' is the standard pattern. 'The GitHub plugin' needs an article. In the two-sentence practice example, 'before' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"before"},{"id":"legacy-021","date":null,"tags":["Useful expressions","Sentence structure","Sentence linking"],"title":"Describing an error","original":"I clicked the connect button but I found that there's an error.","corrected":"I clicked the Connect button, but I got an error.","example":"I clicked the Connect button, but I got an error. Since I don't know what caused it, I'd like to check the permissions first.","ko":"연결 버튼을 눌렀는데 오류가 발생했어요.","exampleKo":"연결 버튼을 눌렀지만 오류가 났어요. 원인을 모르기 때문에 먼저 권한을 확인하고 싶어요.","why":"'Got an error' is concise and idiomatic in software conversations. A comma separates the two clauses before 'but'. In the two-sentence practice example, 'Since' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Since"},{"id":"legacy-022","date":null,"tags":["Articles","Natural phrasing","Sentence linking"],"title":"Enabling MFA","original":"Error message shows that it requires multi-factor authentication. How can I enable it?","corrected":"The error message says multi-factor authentication is required. How can I enable it?","example":"The error message says multi-factor authentication is required. How can I enable it so that I can connect my account?","ko":"오류 메시지에 다중 인증이 필요하다고 나와요. 어떻게 활성화하나요?","exampleKo":"오류 메시지에 다중 인증이 필요하다고 나와요. 계정을 연결할 수 있도록 어떻게 활성화하나요?","why":"Use 'the error message' and 'says' for displayed messages. 'It' clearly refers to multi-factor authentication. In the two-sentence practice example, 'so that' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"so that"},{"id":"legacy-025","date":null,"tags":["Prepositions","Verb patterns","Sentence linking"],"title":"Discussing prior questions","original":"Just before I asked two questions regarding I'm connecting with GitHub and my personal project.","corrected":"I just asked two questions about connecting GitHub and working on my personal project.","example":"I just asked two questions about connecting GitHub and working on my project. Could you correct my English so I can ask similar questions more naturally next time?","ko":"방금 GitHub 연결과 개인 프로젝트 작업에 관해 두 가지 질문을 했어요.","exampleKo":"방금 GitHub 연결과 프로젝트 작업에 관해 두 가지 질문을 했어요. 다음에는 비슷한 질문을 더 자연스럽게 할 수 있도록 영어를 교정해 주시겠어요?","why":"'About' is more natural than 'regarding' here. After a preposition, use gerunds: 'connecting' and 'working'. In the two-sentence practice example, 'so' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"so"},{"id":"2026-11-09-02","date":"2026-11-09","tags":["Natural phrasing","Verb patterns","Sentence linking"],"title":"Combining sections","original":"I think we can also combine corrections and practice buttons together.","corrected":"I think we can combine the Corrections and Practice sections into one.","example":"I think we can combine the Corrections and Practice sections into one. If we do that, the page will be easier to navigate.","ko":"교정과 연습 섹션을 하나로 합칠 수 있을 것 같아요.","exampleKo":"교정과 연습 섹션을 하나로 합칠 수 있을 것 같아요. 그렇게 하면 페이지를 더 쉽게 이용할 수 있을 거예요.","why":"'Sections' describes the content more accurately than 'buttons'. 'Combine A and B into one' is a common pattern. In the two-sentence practice example, 'If' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"If"},{"id":"2026-11-09-03","date":"2026-11-09","tags":["Useful expressions","Word choice","Sentence linking"],"title":"Expanding cards","original":"I'd like the cards to be collapsed and uncollapsed with clicking.","corrected":"I'd like each card to expand and collapse when I tap it.","example":"I'd like each card to expand when I tap it. When I tap it again, it should collapse so I can focus on the next sentence.","ko":"카드를 탭하면 펼쳐지고 다시 탭하면 접히게 하고 싶어요.","exampleKo":"카드를 탭하면 펼쳐지게 하고 싶어요. 다시 탭하면 접혀서 다음 문장에 집중할 수 있으면 좋겠어요.","why":"'Expand and collapse' are standard UI verbs. 'Tap' is more natural for touchscreens than 'click'. In the two-sentence practice example, 'When' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"When"},{"id":"2026-11-09-04","date":"2026-11-09","tags":["Comparatives","Sentence structure","Sentence linking"],"title":"Making the page simpler","original":"Plus, I I'd like you to make our page more simpler.","corrected":"I'd also like you to make the page simpler.","example":"I'd like to make the page simpler. Although the extra features might be useful, I don't want them to distract me while I'm studying.","ko":"페이지도 더 간단하게 만들어 주셨으면 해요.","exampleKo":"페이지를 더 간단하게 만들고 싶어요. 추가 기능이 유용할 수는 있지만 공부할 때 집중을 방해하지 않았으면 해요.","why":"'Simpler' is already comparative, so 'more simpler' is redundant. 'I'd also like' is a smoother transition. In the two-sentence practice example, 'Although' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Although"},{"id":"2026-11-09-05","date":"2026-11-09","tags":["Natural phrasing","Verb patterns","Sentence linking"],"title":"Organizing by date","original":"I'd like to manage this card to be managed by date so that I can check which date I added this card.","corrected":"I'd like to organize the cards by date so I can see when each one was added.","example":"I'd like to organize the cards by date so I can see when each one was added. That way, I can review my most recent mistakes first.","ko":"각 카드를 언제 추가했는지 알 수 있도록 날짜별로 정리하고 싶어요.","exampleKo":"각 카드가 언제 추가되었는지 볼 수 있도록 날짜별로 정리하고 싶어요. 그러면 최근에 한 실수부터 복습할 수 있어요.","why":"Use 'organize cards by date' rather than repeating 'manage'. 'When each one was added' is more idiomatic than 'which date I added this card'. In the two-sentence practice example, 'That way' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"That way"},{"id":"2026-11-09-06","date":"2026-11-09","tags":["Prepositions","Useful expressions","Sentence linking"],"title":"Adding tags","original":"I want to add some tags to the card so that I can search or merge them by the tag someday.","corrected":"I'd like to add tags to each card so I can search for or group them by tag later.","example":"I'd like to add grammar-related tags to each card. If I keep making the same mistake, I can filter by that tag and practice it again.","ko":"나중에 태그별로 검색하거나 묶을 수 있도록 각 카드에 태그를 추가하고 싶어요.","exampleKo":"각 카드에 문법 관련 태그를 추가하고 싶어요. 같은 실수를 계속하면 그 태그로 필터링해서 다시 연습할 수 있어요.","why":"'Group by tag' is clearer than 'merge by the tag' for organizing items. 'Search for' takes the preposition 'for'. In the two-sentence practice example, 'If' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"If"},{"id":"2026-11-09-07","date":"2026-11-09","tags":["Plural nouns","Prepositions","Sentence linking"],"title":"Keeping corrections updated","original":"Plus keep uploading the corrected sentence to the HTML page, including recent conversation.","corrected":"Please keep adding corrected sentences from our recent conversations to the HTML page.","example":"Please keep adding corrected sentences from our recent conversations. Whenever we finish a practice session, I'd like the new examples to appear on the page.","ko":"최근 대화에서 교정한 문장도 HTML 페이지에 계속 추가해 주세요.","exampleKo":"최근 대화에서 교정한 문장을 계속 추가해 주세요. 연습을 마칠 때마다 새 예문이 페이지에 나타나면 좋겠어요.","why":"Use plural 'corrected sentences' for multiple entries, and 'from our recent conversations' for their source. In the two-sentence practice example, 'Whenever' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Whenever"},{"id":"2026-11-09-08","date":"2026-11-09","tags":["Verb patterns","Natural phrasing","Sentence linking"],"title":"Clarifying the purpose of tags","original":"I didn't mean the tags includes UI/UX grammar GitHub communication, this kind of things.","corrected":"I didn't mean tags like UI/UX, GitHub, or Communication. I meant tags related to English grammar and usage.","example":"I didn't mean tags for topics like GitHub or UI design. Instead, I meant grammar tags that help me identify the mistakes I make most often.","ko":"UI/UX나 GitHub 같은 태그가 아니라 영어 문법이나 표현에 관한 태그를 뜻했어요.","exampleKo":"GitHub나 UI 디자인 같은 주제 태그를 뜻한 게 아니에요. 대신 제가 자주 하는 실수를 파악하는 데 도움이 되는 문법 태그를 뜻했어요.","why":"After 'mean', use a noun phrase such as 'tags like ...'. 'Tags related to' expresses the intended category clearly. In the two-sentence practice example, 'Instead' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Instead"},{"id":"2026-11-09-09","date":"2026-11-09","tags":["Passive voice","Verb patterns","Sentence linking"],"title":"Removing unnecessary corrections","original":"Please remove it if it's the case.","corrected":"Please remove any cards where my original sentence was already natural.","example":"Please remove cards where my original sentence was already natural. Since I want to focus on my mistakes, I don't need cards that repeat something I said correctly.","ko":"제가 원래 말한 문장이 이미 자연스러웠던 카드는 삭제해 주세요.","exampleKo":"제가 원래 말한 문장이 이미 자연스러웠던 카드는 삭제해 주세요. 실수에 집중하고 싶어서 이미 맞게 말한 문장을 반복하는 카드는 필요 없어요.","why":"'If it's the case' is vague here. 'Any cards where...' specifies exactly which entries should be removed. In the two-sentence practice example, 'Since' connects the ideas. Notice how the second sentence adds a reason, condition, contrast, or result.","linking":"Since"}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function highlighted(text,phrase){const i=text.toLowerCase().indexOf(phrase.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark class="emphasis">'+esc(text.slice(i,i+phrase.length))+'</mark>'+esc(text.slice(i+phrase.length))}
const tagSelect=document.getElementById('tag');[...new Set(cards.flatMap(c=>c.tags))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tagSelect.appendChild(o)});
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),tag=tagSelect.value,sort=document.getElementById('sort').value;const items=cards.filter(c=>(!tag||c.tags.includes(tag))&&[c.title,c.original,c.corrected,c.example,c.exampleKo,c.why,...c.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>sort==='newest'?(b.date||'').localeCompare(a.date||''):(a.date||'').localeCompare(b.date||''));document.getElementById('count').textContent=items.length+' of '+cards.length+' practice cards';document.getElementById('entries').innerHTML=items.map(c=>'<details class="entry"><summary><div class="front"><div class="meta">'+esc(c.date||'Date unavailable')+'</div><div class="korean">'+esc(c.exampleKo)+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="answer"><div class="field"><div class="label">Two-sentence English practice</div><div class="value model">'+highlighted(c.example,c.linking)+'</div></div><div class="field"><div class="label">Your actual sentence</div><div class="value original">'+esc(c.original)+'</div></div><div class="field"><div class="label">Corrected sentence</div><div class="value corrected">'+esc(c.corrected)+'</div></div><div class="explanation"><div class="label">What to learn</div><div class="note">'+highlighted(c.why,c.linking)+'</div></div></div></details>').join('')||'<p class="empty">No matching sentences.</p>'}
document.getElementById('search').addEventListener('input',render);tagSelect.addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);render();
</script></body></html>
