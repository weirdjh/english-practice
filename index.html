<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>English Practice</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#202b3b}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:32px 18px 80px}h1{font-size:29px;letter-spacing:-.04em;margin:0 0 7px}header p{color:#6e7b8c;margin:0 0 23px;line-height:1.5}input,select{font:inherit;border:1px solid #dce3ed;background:white;border-radius:10px;padding:11px;color:#27313f}input{width:100%}select{font-size:13px;max-width:100%}input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a7bce8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.count{font-size:12px;color:#818894;margin:14px 0}.entry{background:white;border:1px solid #e0e7ef;border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 3px 12px #1a355006}.entry[open]{border-color:#adc5e5}.entry summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:19px;min-height:100px}.entry summary::-webkit-details-marker{display:none}.front{flex:1;min-width:0}.meta{font-size:11px;color:#8894a4;margin-bottom:10px}.korean{font-size:17px;font-weight:550;line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}.chevron{color:#7288a5;font-size:21px;transition:transform .18s}.entry[open] .chevron{transform:rotate(180deg)}.answer{padding:0 19px 20px;border-top:1px solid #edf0f4}.field{margin-top:18px}.label{font-size:11px;font-weight:750;letter-spacing:.06em;color:#6f829b;text-transform:uppercase;margin-bottom:7px}.value{font-size:15px;line-height:1.7;overflow-wrap:anywhere}.model{background:#f0f6ff;border-left:3px solid #4380d8;padding:13px 14px;border-radius:0 9px 9px 0;font-weight:550}.original{color:#777f8c}.corrected{font-weight:650;color:#1c654b}.note{font-size:14px;line-height:1.8;color:#5f6d7f;white-space:pre-line}.explanation{margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4}.emphasis{background:#fff0bc;color:#81550b;border-radius:3px;padding:1px 3px;font-weight:750}.empty{color:#858c97;padding:30px 0}footer{font-size:12px;color:#9299a5;margin-top:30px}@media(max-width:420px){main{padding-top:24px}.entry summary{padding:16px}.answer{padding:0 16px 18px}}
</style></head><body><main><header><h1>English Practice</h1><p>Translate the three Korean sentences aloud, then tap to compare and learn.</p></header><input id="search" type="search" placeholder="Search sentences and grammar points…" aria-label="Search sentences"><div class="filters"><select id="tag" aria-label="Filter by grammar tag"><option value="">All grammar points</option></select><select id="sort" aria-label="Sort by date"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="count" class="count"></div><div id="entries"></div><footer>Older cards have no verified original added date. Tags are used for filtering, not shown on collapsed cards.</footer></main><script>
const cards=[{"id":"legacy-005","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Discussing a project","original":"I'd like to discuss about my personal small project working in my codex.","corrected":"I'd like to talk about a small personal project I've been working on using Codex.","example":"I've been working on a side project in my spare time. That said, I haven't made as much progress as I'd hoped. I'm trying to get back on track by setting smaller goals.","ko":"Codex로 진행 중인 작은 개인 프로젝트에 대해 이야기하고 싶어요.","exampleKo":"여가 시간에 개인 프로젝트를 진행해 왔어요. 그렇긴 하지만 기대했던 만큼 진척되지는 않았어요. 더 작은 목표를 세워서 다시 계획대로 진행하려고 해요.","why":"Original correction: Use 'discuss a project' or 'talk about a project', not 'discuss about'. Say 'work on a project'.\n\nAdvanced usage: Present perfect continuous frames the project as an ongoing effort; 'haven't made as much progress as I'd hoped' compares actual progress with an earlier expectation. 'That said' qualifies the positive first statement rather than contradicting it outright. 'Get back on track' means returning to a plan after drifting off schedule.","linking":"That said"},{"id":"legacy-007","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Developing on mobile","original":"Can you develop with just chatting in mobile?","corrected":"Can you help me develop the project just by chatting with me on my phone?","example":"I won't have access to my laptop while I'm commuting. Even so, I'd like to make the most of that time. If the project is on GitHub, I should still be able to review changes on my phone.","ko":"휴대폰에서 채팅만으로 프로젝트 개발을 도와줄 수 있나요?","exampleKo":"출퇴근하는 동안 노트북을 사용할 수 없을 거예요. 그래도 그 시간을 최대한 활용하고 싶어요. 프로젝트가 GitHub에 있다면 휴대폰으로도 변경 사항을 검토할 수 있을 거예요.","why":"Original correction: Say 'on my phone', not 'in mobile'. 'Help me develop the project' specifies the action.\n\nAdvanced usage: 'Even so' concedes a practical obstacle without abandoning the goal. 'Make the most of' implies using limited time or resources effectively, not merely spending time. 'Should still be able to' conveys a reasonable expectation, not a guarantee.","linking":"Even so"},{"id":"legacy-004","date":null,"tags":["Uncountable nouns","Prepositions","Sentence linking","Useful expressions","Tenses"],"title":"Sharing information","original":"How can I give you an information of my account?","corrected":"How can I share my account information with you?","example":"I was about to share my account details, but I wasn't sure what you needed. To be on the safe side, I decided to leave out anything sensitive. Could you tell me which information is actually necessary?","ko":"계정 정보를 어떻게 공유하면 될까요?","exampleKo":"계정 정보를 공유하려던 참이었지만 어떤 정보가 필요한지 확실하지 않았어요. 안전을 위해 민감한 정보는 제외하기로 했어요. 실제로 어떤 정보가 필요한지 알려주시겠어요?","why":"Original correction: 'Information' is uncountable, so don't use 'an'. The natural expression is 'share information with someone'.\n\nAdvanced usage: 'Was about to' expresses an action that was imminent but did not necessarily happen. 'To be on the safe side' introduces a precaution under uncertainty; it is softer than saying something is definitely dangerous. 'Leave out' is a natural phrasal verb for deliberately omitting information.","linking":"To be on the safe side"},{"id":"legacy-014","date":null,"tags":["Countable nouns","Quantifiers","Sentence linking","Useful expressions","Tenses"],"title":"Requesting all corrections","original":"There are much more corrections in this session.","corrected":"There are many more corrections from this conversation.","example":"We've covered quite a few corrections over the past few days. Looking back, I keep making similar mistakes when I speak spontaneously. I'd rather work on those patterns than memorize isolated rules.","ko":"이 대화에는 더 많은 교정 문장이 있어요.","exampleKo":"지난 며칠 동안 꽤 많은 문장을 교정했어요. 돌이켜 보면 즉흥적으로 말할 때 비슷한 실수를 계속하고 있어요. 개별 규칙을 외우기보다는 그런 패턴을 개선하고 싶어요.","why":"Original correction: Use 'many' with countable plural nouns such as 'corrections'; use 'much' with uncountable nouns.\n\nAdvanced usage: 'We've covered' treats the past few days as a period connected to the present. 'Looking back' signals retrospective evaluation; 'keep + -ing' emphasizes repeated behavior, often undesirable. 'I'd rather A than B' expresses a preference without implying B is impossible.","linking":"Looking back"},{"id":"legacy-017","date":null,"tags":["Adverbs","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Studying more efficiently","original":"In order to study more efficient, I want some features that hiding Korean or English.","corrected":"To study more efficiently, I'd like a feature that lets me hide either the Korean or the English text.","example":"I've been trying to make my commute more productive. Rather than reading the English answers straight away, I now translate the Korean prompts myself. It's been paying off because I'm getting quicker at forming sentences.","ko":"더 효율적으로 공부하려고 한국어나 영어를 숨길 수 있는 기능이 필요해요.","exampleKo":"출퇴근 시간을 더 생산적으로 활용하려고 노력해 왔어요. 영어 정답을 바로 읽기보다는 이제 한국어 문장을 직접 번역해요. 영어 문장을 만드는 속도가 빨라지고 있어서 그 노력이 효과를 보고 있어요.","why":"Original correction: 'Efficiently' is the adverb modifying 'study'. Say 'a feature that lets me hide' rather than 'features that hiding'.\n\nAdvanced usage: 'Rather than + -ing' contrasts two methods without requiring a separate sentence. 'It's been paying off' uses present perfect progressive meaning a strategy is yielding benefits over time. 'Straight away' is a common conversational alternative to 'immediately'.","linking":"Rather than"},{"id":"legacy-020","date":null,"tags":["Articles","Prepositions","Sentence linking","Useful expressions","Tenses"],"title":"Connecting GitHub","original":"I'm now having trouble connecting GitHub plugin in ChatGPT.","corrected":"I'm having trouble connecting the GitHub plugin to ChatGPT.","example":"I've been having trouble connecting an external service to my account. As far as I can tell, the issue is related to authentication rather than permissions. I'll look into it before changing any more settings.","ko":"ChatGPT에 GitHub 플러그인을 연결하는 데 문제가 있어요.","exampleKo":"외부 서비스를 제 계정에 연결하는 데 계속 문제가 있어요. 제가 파악한 바로는 권한보다는 인증과 관련된 문제예요. 설정을 더 바꾸기 전에 원인을 조사해 볼게요.","why":"Original correction: 'Connect A to B' is the standard pattern. 'The GitHub plugin' needs an article.\n\nAdvanced usage: 'As far as I can tell' limits a technical diagnosis to available evidence and avoids overstating certainty. 'Rather than' contrasts competing explanations. 'Look into' means investigate; unlike 'look at', it implies trying to understand the cause.","linking":"As far as I can tell"},{"id":"legacy-021","date":null,"tags":["Useful expressions","Sentence structure","Sentence linking","Tenses"],"title":"Describing an error","original":"I clicked the connect button but I found that there's an error.","corrected":"I clicked the Connect button, but I got an error.","example":"I clicked the Connect button, but the request failed. It turns out I hadn't enabled the authentication method the service required. Once I'd fixed that, I was able to connect without any issues.","ko":"연결 버튼을 눌렀는데 오류가 발생했어요.","exampleKo":"연결 버튼을 눌렀지만 요청이 실패했어요. 알고 보니 서비스에서 요구하는 인증 방법을 활성화하지 않았더라고요. 그 문제를 해결하고 나니 아무 문제 없이 연결할 수 있었어요.","why":"Original correction: 'Got an error' is concise and idiomatic in software conversations. A comma separates the two clauses before 'but'.\n\nAdvanced usage: 'It turns out' introduces information discovered after an earlier assumption. 'Hadn't enabled' is past perfect because the missing setup preceded the failed request. 'Once I'd fixed that' orders two completed past events and makes the causal sequence clear.","linking":"It turns out"},{"id":"legacy-025","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Discussing prior questions","original":"Just before I asked two questions regarding I'm connecting with GitHub and my personal project.","corrected":"I just asked two questions about connecting GitHub and working on my personal project.","example":"I brought up two questions earlier, but I don't think I explained them very clearly. What I was getting at was whether I could manage my project entirely from my phone. In other words, I wanted to know how much I could do without opening my laptop.","ko":"방금 GitHub 연결과 개인 프로젝트 작업에 관해 두 가지 질문을 했어요.","exampleKo":"아까 질문 두 가지를 꺼냈지만 충분히 명확하게 설명하지 못한 것 같아요. 제가 말하려던 핵심은 휴대폰만으로 프로젝트를 관리할 수 있는지였어요. 다시 말해 노트북을 열지 않고 어디까지 할 수 있는지 알고 싶었어요.","why":"Original correction: 'About' is more natural than 'regarding' here. After a preposition, use gerunds: 'connecting' and 'working'.\n\nAdvanced usage: 'What I was getting at' is a natural way to clarify the underlying point after a confusing explanation. 'In other words' restates an idea more plainly, whereas 'that said' introduces a qualification. 'Brought up' means introduced a topic for discussion.","linking":"What I was getting at"},{"id":"2026-11-09-05","date":"2026-11-09","tags":["Natural phrasing","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Organizing by date","original":"I'd like to manage this card to be managed by date so that I can check which date I added this card.","corrected":"I'd like to organize the cards by date so I can see when each one was added.","example":"I used to review my corrections in no particular order. Over time, I realized I was repeating the same mistakes without noticing. That's why I've started organizing the cards by date and grammar point.","ko":"각 카드를 언제 추가했는지 알 수 있도록 날짜별로 정리하고 싶어요.","exampleKo":"예전에는 교정 문장을 특별한 순서 없이 복습하곤 했어요. 시간이 지나면서 같은 실수를 알아채지 못한 채 반복하고 있다는 걸 깨달았어요. 그래서 날짜와 문법 항목별로 카드를 정리하기 시작했어요.","why":"Original correction: Use 'organize cards by date' rather than repeating 'manage'. 'When each one was added' is more idiomatic than 'which date I added this card'.\n\nAdvanced usage: 'Used to' describes a discontinued past habit; 'I've started' presents a recent change that remains relevant now. 'Over time' describes gradual realization, not a single moment. 'That's why' links the observed problem to a concrete decision.","linking":"Over time"},{"id":"2026-11-09-08","date":"2026-11-09","tags":["Verb patterns","Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Clarifying the purpose of tags","original":"I didn't mean the tags includes UI/UX grammar GitHub communication, this kind of things.","corrected":"I didn't mean tags like UI/UX, GitHub, or Communication. I meant tags related to English grammar and usage.","example":"I wasn't asking for tags based on conversation topics. What I had in mind was a way to group recurring language mistakes. In this sense, the tags should describe what I need to practice, not what we happened to be talking about.","ko":"UI/UX나 GitHub 같은 태그가 아니라 영어 문법이나 표현에 관한 태그를 뜻했어요.","exampleKo":"대화 주제별 태그를 요청한 건 아니었어요. 제가 염두에 둔 건 반복되는 언어 실수를 묶는 방법이었어요. 이런 의미에서 태그는 우리가 우연히 이야기한 주제가 아니라 제가 연습해야 할 내용을 나타내야 해요.","why":"Original correction: After 'mean', use a noun phrase such as 'tags like ...'. 'Tags related to' expresses the intended category clearly.\n\nAdvanced usage: 'What I had in mind' corrects another person's interpretation without sounding accusatory. 'In this sense' narrows the meaning of the claim to the perspective just established; it is not a universal replacement for 'so'. 'Happened to be talking about' emphasizes that the topic was incidental.","linking":"What I had in mind"}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function highlighted(text,phrase){const i=text.toLowerCase().indexOf(phrase.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark class="emphasis">'+esc(text.slice(i,i+phrase.length))+'</mark>'+esc(text.slice(i+phrase.length))}
const tagSelect=document.getElementById('tag');[...new Set(cards.flatMap(c=>c.tags))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tagSelect.appendChild(o)});
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),tag=tagSelect.value,sort=document.getElementById('sort').value;const items=cards.filter(c=>(!tag||c.tags.includes(tag))&&[c.title,c.original,c.corrected,c.example,c.exampleKo,c.why,...c.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>sort==='newest'?(b.date||'').localeCompare(a.date||''):(a.date||'').localeCompare(b.date||''));document.getElementById('count').textContent=items.length+' of '+cards.length+' practice cards';document.getElementById('entries').innerHTML=items.map(c=>'<details class="entry"><summary><div class="front"><div class="meta">'+esc(c.date||'Date unavailable')+'</div><div class="korean">'+esc(c.exampleKo)+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="answer"><div class="field"><div class="label">Three-sentence English practice</div><div class="value model">'+highlighted(c.example,c.linking)+'</div></div><div class="field"><div class="label">Your actual sentence</div><div class="value original">'+esc(c.original)+'</div></div><div class="field"><div class="label">Corrected sentence</div><div class="value corrected">'+esc(c.corrected)+'</div></div><div class="explanation"><div class="label">What to learn</div><div class="note">'+highlighted(c.why,c.linking)+'</div></div></div></details>').join('')||'<p class="empty">No matching sentences.</p>'}
document.getElementById('search').addEventListener('input',render);tagSelect.addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);render();
</script></body></html>
