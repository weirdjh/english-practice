<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafa"><title>English Practice</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20242b;background:#fafafa}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:36px 18px 90px}h1{font-size:29px;letter-spacing:-.04em;margin:0 0 7px}header p{color:#717783;margin:0 0 26px;line-height:1.5}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}button{font:inherit;cursor:pointer;border:1px solid #dedfe4;background:#fff;color:#4d5564;border-radius:9px;padding:10px 13px;font-size:13px}button.selected{background:#242b37;color:white;border-color:#242b37}button:focus-visible,input:focus-visible{outline:3px solid #a7bce8}input{width:100%;padding:12px 13px;border:1px solid #dedfe4;border-radius:10px;font:inherit;background:white;margin-bottom:14px}.count{font-size:12px;color:#818894;margin:7px 0 17px}.entry{background:#fff;border:1px solid #e7e8eb;border-radius:13px;padding:20px;margin:12px 0}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.heading strong{font-size:15px}.heading span{color:#9299a5;font-size:12px}.field{margin-top:15px}.label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#828b99;text-transform:uppercase;margin-bottom:6px}.value{line-height:1.6;font-size:15px}.original{color:#747b87}.corrected{font-weight:650}.korean{color:#626a77;font-size:14px;line-height:1.6;margin-top:7px}.explanation{font-size:14px;line-height:1.65;color:#606a79;border-top:1px solid #eff0f2;padding-top:13px;margin-top:17px}.mode-ko .english,.mode-ko .explanation,.mode-en .korean{display:none}.mode-ko .korean{font-size:17px;color:#242b37;font-weight:550;margin:12px 0}.mode-ko .entry{padding-bottom:13px}.reveal{margin-top:13px}.hidden-answer{display:none}.mode-ko .entry.revealed .english,.mode-ko .entry.revealed .explanation{display:block}.mode-ko .entry.revealed .hidden-answer{display:none}.mode-ko .entry .hidden-answer{display:inline-block}.mode-en .entry .hidden-answer,.mode-both .entry .hidden-answer{display:none}.empty{color:#858c97;padding:30px 0}footer{font-size:12px;color:#9299a5;margin-top:30px}@media(max-width:420px){main{padding-top:25px}.toolbar button{flex:1;padding:10px 8px}}
</style></head><body class="mode-both"><main><header><h1>English Practice</h1><p>Read, recall, and learn from your own sentences.</p></header>
<div class="toolbar" aria-label="Choose language display"><button data-mode="both" class="selected" aria-pressed="true">Both</button><button data-mode="ko" aria-pressed="false">Korean only</button><button data-mode="en" aria-pressed="false">English only</button></div>
<input id="search" type="search" placeholder="Search sentences…" aria-label="Search sentences"><div class="count" id="count"></div><div id="entries"></div><footer>Study notes from selected conversations. Language preference is saved on this device.</footer></main>
<script>
const lessons=[["Creating a repository","All right, I made new repository to my account.","All right, I've created a new repository under my account.","I've pushed the latest changes to the new repository.","새 저장소를 제 계정에 만들었어요.","새 저장소에 최신 변경 사항을 푸시했어요.","A singular countable noun needs an article: 'a new repository'. We usually say a repository is created 'under' an account."],["Checking permissions","I've updated permission, can you check again?","I've updated the permissions. Could you check again?","Could you verify that you have write access now?","권한을 업데이트했어요. 다시 확인해 주시겠어요?","이제 쓰기 권한이 있는지 확인해 주시겠어요?","Use plural 'permissions' for access settings. Separate the two independent clauses with a period rather than a comma."],["Checking account identity","I don't think it's on right name. Can you check again?","I don't think that's the correct username. Could you double-check which GitHub account is connected?","Can you confirm which account owns this repository?","올바른 사용자 이름이 아닌 것 같아요. 연결된 계정을 다시 확인해 주시겠어요?","이 저장소를 소유한 계정을 확인해 주시겠어요?","'Username' precisely describes a GitHub login. 'Double-check' is natural when requesting verification."],["Sharing information","How can I give you an information of my account?","How can I share my account information with you?","What's the best way to share my project details?","계정 정보를 어떻게 공유하면 될까요?","프로젝트 정보를 공유하는 가장 좋은 방법은 무엇인가요?","'Information' is uncountable, so don't use 'an'. The natural expression is 'share information with someone'."],["Discussing a project","I'd like to discuss about my personal small project working in my codex.","I'd like to talk about a small personal project I've been working on using Codex.","I've been working on a side project in my spare time.","Codex로 진행 중인 작은 개인 프로젝트에 대해 이야기하고 싶어요.","여가 시간에 사이드 프로젝트를 진행해 왔어요.","Use 'discuss a project' or 'talk about a project', not 'discuss about'. Say 'work on a project'."],["Storing source code","The code is inside my laptop and my GitHub project.","The source code is stored both on my laptop and in a GitHub repository.","All the configuration files are stored in the repository.","소스 코드가 노트북과 GitHub 저장소 양쪽에 있어요.","모든 설정 파일이 저장소에 보관되어 있어요.","Files are 'on' a laptop, and a GitHub code project is more precisely called a 'repository'."],["Developing on mobile","Can you develop with just chatting in mobile?","Can you help me develop the project just by chatting with me on my phone?","Can I review pull requests on my phone?","휴대폰에서 채팅만으로 프로젝트 개발을 도와줄 수 있나요?","휴대폰으로 풀 리퀘스트를 검토할 수 있나요?","Say 'on my phone', not 'in mobile'. 'Help me develop the project' specifies the action."],["Choosing visibility","I think public is also fine.","I'm fine with making the repository public, too.","I'd prefer to keep the repository private until the first release.","저장소를 공개로 만들어도 괜찮아요.","첫 릴리스 전까지는 비공개로 두고 싶어요.","Your original sentence is understandable. Naming 'the repository' makes your meaning more specific."],["Requesting study features","You should show me an original sentence and corrected sentence and other example sentence.","I'd like you to show my original sentence, a corrected version, and another example sentence.","Please include a short explanation of why the correction sounds more natural.","제가 말한 원문, 교정된 문장, 추가 예문을 보여주세요.","왜 교정문이 더 자연스러운지 짧은 설명도 포함해 주세요.","Use parallel noun phrases and articles: 'my original sentence, a corrected version, and another example sentence'."],["Requesting a repository upload","Okay then, can you upload HTML page to this repository?","Okay, could you upload the HTML page to this repository?","Could you commit the updated website to the main branch?","HTML 페이지를 이 저장소에 업로드해 주시겠어요?","업데이트한 웹사이트를 main 브랜치에 커밋해 주시겠어요?","Use 'the HTML page' when referring to a specific page. 'Could you' is a polite, natural request."],["Finding settings","I couldn't find any GitHub Pages settings. Where can I find the setting page?","I couldn't find the GitHub Pages settings. Where can I find them?","I couldn't find the deployment settings. Could you show me where they are?","GitHub Pages 설정을 찾을 수 없었어요. 어디에 있나요?","배포 설정을 찾을 수 없었어요. 어디에 있는지 알려주시겠어요?","Use 'the' for a specific settings section. 'Them' refers naturally to the plural noun 'settings'."],["Confirming deployment","I checked the, I checked. I can access to the page.","I checked, and I can access the page now.","I opened the website on my phone, and everything seems to work.","확인해 봤는데 이제 페이지에 접속할 수 있어요.","휴대폰으로 웹사이트를 열었는데 모두 잘 작동하는 것 같아요.","'Access' is a transitive verb, so say 'access the page', not 'access to the page'. Remove repeated words in polished writing."],["Expressing appreciation","Thank you for your effort.","Thanks for your help. I really appreciate it.","I appreciate all the work you've put into this.","도와주셔서 감사합니다. 정말 감사해요.","여기에 쏟아주신 노력에 감사해요.","'Thank you for your effort' is grammatical, but 'Thanks for your help' or 'I appreciate your help' sounds warmer and more idiomatic."],["Requesting all corrections","There are much more corrections in this session.","There are many more corrections from this conversation.","I think we've covered quite a few useful expressions that aren't on the page yet.","이 대화에는 더 많은 교정 문장이 있어요.","아직 페이지에 없는 유용한 표현을 꽤 많이 다룬 것 같아요.","Use 'many' with countable plural nouns such as 'corrections'; use 'much' with uncountable nouns."],["Comparing recent and older content","However I can find very recent conversations.","However, I can only find corrections from our most recent conversations.","Could you include the corrections from earlier in our conversation, too?","하지만 최근 대화의 교정 내용만 찾을 수 있어요.","이전 대화에서 교정한 내용도 포함해 주시겠어요?","'Only' communicates the missing older material. 'Corrections from conversations' is more precise than 'find conversations'."],["Requesting a complete update","I'd like you to update full corrections to the page.","I'd like you to add all the corrections from our conversation to the page.","Could you update the page to include our earlier corrections?","우리 대화에서 교정한 모든 문장을 페이지에 추가해 주세요.","이전에 교정한 문장도 포함하도록 페이지를 업데이트해 주시겠어요?","Use 'add ... to the page' for new entries. 'All the corrections' is more idiomatic than 'full corrections'."],["Studying more efficiently","In order to study more efficient, I want some features that hiding Korean or English.","To study more efficiently, I'd like a feature that lets me hide either the Korean or the English text.","It would help me practice if I could hide the answers until I'm ready.","더 효율적으로 공부하려고 한국어나 영어를 숨길 수 있는 기능이 필요해요.","준비될 때까지 정답을 숨길 수 있다면 연습에 도움이 될 거예요.","'Efficiently' is the adverb modifying 'study'. Say 'a feature that lets me hide' rather than 'features that hiding'."],["Korean-only practice","If I click show only Korean button, then I can only check Korean version, Korean translate.","If I tap the 'Korean only' button, I want to see only the Korean translations.","I'd like to use the Korean prompts to practice forming English sentences.","'한국어만 보기' 버튼을 누르면 한국어 번역만 보이게 하고 싶어요.","한국어 문장을 보고 영어 문장을 만드는 연습을 하고 싶어요.","Use 'tap' for mobile buttons. 'Korean translations' is more natural than 'Korean translate'."],["Creating English from prompts","And I can make English sentence with leading Korean.","Then I can try to make an English sentence using the Korean translation as a prompt.","I'll translate the Korean sentence into English before revealing the answer.","그러면 한국어 번역을 힌트로 영어 문장을 만들어 볼 수 있어요.","정답을 보기 전에 한국어 문장을 영어로 번역해 볼게요.","Say 'an English sentence' (article required) and 'using ... as a prompt' rather than 'with leading Korean'."],["Connecting GitHub","I'm now having trouble connecting GitHub plugin in ChatGPT.","I'm having trouble connecting the GitHub plugin to ChatGPT.","I'm having trouble granting the app access to my repository.","ChatGPT에 GitHub 플러그인을 연결하는 데 문제가 있어요.","앱에 저장소 접근 권한을 부여하는 데 문제가 있어요.","'Connect A to B' is the standard pattern. 'The GitHub plugin' needs an article."],["Describing an error","I clicked the connect button but I found that there's an error.","I clicked the Connect button, but I got an error.","I tried to authorize the integration, but GitHub returned an error.","연결 버튼을 눌렀는데 오류가 발생했어요.","연동을 승인하려고 했지만 GitHub에서 오류가 발생했어요.","'Got an error' is concise and idiomatic in software conversations. A comma separates the two clauses before 'but'."],["Enabling MFA","Error message shows that it requires multi-factor authentication. How can I enable it?","The error message says multi-factor authentication is required. How can I enable it?","Do I need to enable two-factor authentication before connecting my account?","오류 메시지에 다중 인증이 필요하다고 나와요. 어떻게 활성화하나요?","계정을 연결하기 전에 2단계 인증을 활성화해야 하나요?","Use 'the error message' and 'says' for displayed messages. 'It' clearly refers to multi-factor authentication."],["Choosing a repository name","I don't want the name to be too abstract. I'd prefer something more straightforward and descriptive.","I don't want the name to be too abstract. I'd prefer something more straightforward and descriptive.","Let's choose a name that clearly describes what the project does.","이름이 너무 추상적이지 않았으면 해요. 더 직관적이고 설명적인 이름이 좋아요.","프로젝트가 무엇을 하는지 명확히 보여주는 이름을 고르죠.","This sentence is already natural. 'Straightforward' and 'descriptive' are useful adjectives for naming decisions."],["Requesting a creative name","I think the name is too specific. Could you come up with something more creative and memorable?","I think the name is too specific. Could you come up with something more creative and memorable?","I'd like something catchy but not overly abstract.","이름이 너무 구체적인 것 같아요. 더 창의적이고 기억에 남는 이름을 제안해 주시겠어요?","눈에 띄면서도 지나치게 추상적이지 않은 이름이 좋겠어요.","'Come up with' means to generate an idea. Your original sentence is already idiomatic."],["Discussing prior questions","Just before I asked two questions regarding I'm connecting with GitHub and my personal project.","I just asked two questions about connecting GitHub and working on my personal project.","Could you correct the English I used in those questions?","방금 GitHub 연결과 개인 프로젝트 작업에 관해 두 가지 질문을 했어요.","그 질문들에서 사용한 영어를 교정해 주시겠어요?","'About' is more natural than 'regarding' here. After a preposition, use gerunds: 'connecting' and 'working'."]];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='both';try{mode=localStorage.getItem('english-practice-language-mode')||'both'}catch(e){}
if(!['both','ko','en'].includes(mode))mode='both';
function applyMode(){document.body.className='mode-'+mode;document.querySelectorAll('[data-mode]').forEach(b=>{const selected=b.dataset.mode===mode;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const items=lessons.map((item,index)=>({item,index})).filter(({item})=>item.join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=items.length+' of '+lessons.length+' corrections';document.getElementById('entries').innerHTML=items.map(({item:a,index:i})=>'<article class="entry"><div class="heading"><strong>'+escapeHtml(a[0])+'</strong><span>'+(i+1)+' / '+lessons.length+'</span></div><div class="field english"><div class="label">Original</div><div class="value original">'+escapeHtml(a[1])+'</div></div><div class="field english"><div class="label">Corrected</div><div class="value corrected">'+escapeHtml(a[2])+'</div></div><div class="korean">'+escapeHtml(a[4])+'</div><div class="field english"><div class="label">Additional example</div><div class="value">'+escapeHtml(a[3])+'</div></div><div class="korean">'+escapeHtml(a[5])+'</div><div class="explanation english"><div class="label">Why?</div>'+escapeHtml(a[6])+'</div><button type="button" class="hidden-answer reveal" aria-expanded="false" data-reveal="'+i+'">Show English answer</button></article>').join('')||'<p class="empty">No matching sentences.</p>'}
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;try{localStorage.setItem('english-practice-language-mode',mode)}catch(e){}applyMode()}));
document.getElementById('entries').addEventListener('click',e=>{const b=e.target.closest('[data-reveal]');if(!b)return;const card=b.closest('.entry');card.classList.add('revealed');b.setAttribute('aria-expanded','true')});
applyMode();
</script></body></html>
