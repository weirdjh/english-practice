<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafa"><title>English Practice</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fafafa;color:#20242b}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:32px 18px 80px}h1{font-size:29px;letter-spacing:-.04em;margin:0 0 7px}header p{color:#717783;margin:0 0 23px;line-height:1.5}input,select{font:inherit;border:1px solid #dedfe4;background:white;border-radius:10px;padding:11px;color:#27313f}input{width:100%}select{font-size:13px;max-width:100%}input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a7bce8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.count{font-size:12px;color:#818894;margin:14px 0}.entry{background:white;border:1px solid #e7e8eb;border-radius:13px;margin:12px 0;overflow:hidden}.entry[open]{border-color:#cdd4df}.entry summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:18px;min-height:82px}.entry summary::-webkit-details-marker{display:none}.front{flex:1;min-width:0}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px;font-size:11px;color:#8a919c}.tag{display:inline-block;border-radius:6px;background:#f1f3f6;color:#647184;padding:3px 7px}.korean{font-size:17px;font-weight:550;line-height:1.55;overflow-wrap:anywhere}.chevron{color:#9299a5;font-size:20px;transition:transform .18s}.entry[open] .chevron{transform:rotate(180deg)}.answer{padding:0 18px 19px;border-top:1px solid #eff0f2}.field{margin-top:18px}.label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#828b99;text-transform:uppercase;margin-bottom:6px}.value{font-size:15px;line-height:1.6;overflow-wrap:anywhere}.original{color:#747b87}.corrected{font-weight:650}.example-ko{color:#626a77;font-size:14px;line-height:1.6;margin-top:6px}.explanation{font-size:14px;line-height:1.65;color:#606a79;margin-top:18px;padding-top:14px;border-top:1px solid #eff0f2}.empty{color:#858c97;padding:30px 0}footer{font-size:12px;color:#9299a5;margin-top:30px}@media(max-width:420px){main{padding-top:24px}.entry summary{padding:16px}.answer{padding:0 16px 18px}}
</style></head><body><main><header><h1>English Practice</h1><p>Read the Korean, say it in English, then tap to reveal the answer.</p></header><input id="search" type="search" placeholder="Search sentences and tags…" aria-label="Search sentences"><div class="filters"><select id="tag" aria-label="Filter by tag"><option value="">All tags</option></select><select id="sort" aria-label="Sort by date"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="count" class="count"></div><div id="entries"></div><footer>Older cards have no verified original added date. New cards are dated when added. Tags are used only for filtering.</footer></main><script>
const cards=[{"id":"legacy-001","date":null,"tags":["Articles","Prepositions"],"title":"Creating a repository","original":"All right, I made new repository to my account.","corrected":"All right, I've created a new repository under my account.","example":"I've pushed the latest changes to the new repository.","ko":"새 저장소를 제 계정에 만들었어요.","exampleKo":"새 저장소에 최신 변경 사항을 푸시했어요.","why":"A singular countable noun needs an article: 'a new repository'. We usually say a repository is created 'under' an account."},{"id":"legacy-002","date":null,"tags":["Plural nouns","Sentence structure"],"title":"Checking permissions","original":"I've updated permission, can you check again?","corrected":"I've updated the permissions. Could you check again?","example":"Could you verify that you have write access now?","ko":"권한을 업데이트했어요. 다시 확인해 주시겠어요?","exampleKo":"이제 쓰기 권한이 있는지 확인해 주시겠어요?","why":"Use plural 'permissions' for access settings. Separate the two independent clauses with a period rather than a comma."},{"id":"legacy-003","date":null,"tags":["Articles","Natural phrasing"],"title":"Checking account identity","original":"I don't think it's on right name. Can you check again?","corrected":"I don't think that's the correct username. Could you double-check which GitHub account is connected?","example":"Can you confirm which account owns this repository?","ko":"올바른 사용자 이름이 아닌 것 같아요. 연결된 계정을 다시 확인해 주시겠어요?","exampleKo":"이 저장소를 소유한 계정을 확인해 주시겠어요?","why":"'Username' precisely describes a GitHub login. 'Double-check' is natural when requesting verification."},{"id":"legacy-004","date":null,"tags":["Uncountable nouns","Prepositions"],"title":"Sharing information","original":"How can I give you an information of my account?","corrected":"How can I share my account information with you?","example":"What's the best way to share my project details?","ko":"계정 정보를 어떻게 공유하면 될까요?","exampleKo":"프로젝트 정보를 공유하는 가장 좋은 방법은 무엇인가요?","why":"'Information' is uncountable, so don't use 'an'. The natural expression is 'share information with someone'."},{"id":"legacy-005","date":null,"tags":["Prepositions","Verb patterns"],"title":"Discussing a project","original":"I'd like to discuss about my personal small project working in my codex.","corrected":"I'd like to talk about a small personal project I've been working on using Codex.","example":"I've been working on a side project in my spare time.","ko":"Codex로 진행 중인 작은 개인 프로젝트에 대해 이야기하고 싶어요.","exampleKo":"여가 시간에 사이드 프로젝트를 진행해 왔어요.","why":"Use 'discuss a project' or 'talk about a project', not 'discuss about'. Say 'work on a project'."},{"id":"legacy-006","date":null,"tags":["Prepositions","Natural phrasing"],"title":"Storing source code","original":"The code is inside my laptop and my GitHub project.","corrected":"The source code is stored both on my laptop and in a GitHub repository.","example":"All the configuration files are stored in the repository.","ko":"소스 코드가 노트북과 GitHub 저장소 양쪽에 있어요.","exampleKo":"모든 설정 파일이 저장소에 보관되어 있어요.","why":"Files are 'on' a laptop, and a GitHub code project is more precisely called a 'repository'."},{"id":"legacy-007","date":null,"tags":["Prepositions","Verb patterns"],"title":"Developing on mobile","original":"Can you develop with just chatting in mobile?","corrected":"Can you help me develop the project just by chatting with me on my phone?","example":"Can I review pull requests on my phone?","ko":"휴대폰에서 채팅만으로 프로젝트 개발을 도와줄 수 있나요?","exampleKo":"휴대폰으로 풀 리퀘스트를 검토할 수 있나요?","why":"Say 'on my phone', not 'in mobile'. 'Help me develop the project' specifies the action."},{"id":"legacy-008","date":null,"tags":["Natural phrasing"],"title":"Choosing visibility","original":"I think public is also fine.","corrected":"I'm fine with making the repository public, too.","example":"I'd prefer to keep the repository private until the first release.","ko":"저장소를 공개로 만들어도 괜찮아요.","exampleKo":"첫 릴리스 전까지는 비공개로 두고 싶어요.","why":"Your original sentence is understandable. Naming 'the repository' makes your meaning more specific."},{"id":"legacy-009","date":null,"tags":["Articles","Natural phrasing"],"title":"Requesting study features","original":"You should show me an original sentence and corrected sentence and other example sentence.","corrected":"I'd like you to show my original sentence, a corrected version, and another example sentence.","example":"Please include a short explanation of why the correction sounds more natural.","ko":"제가 말한 원문, 교정된 문장, 추가 예문을 보여주세요.","exampleKo":"왜 교정문이 더 자연스러운지 짧은 설명도 포함해 주세요.","why":"Use parallel noun phrases and articles: 'my original sentence, a corrected version, and another example sentence'."},{"id":"legacy-010","date":null,"tags":["Articles","Polite requests"],"title":"Requesting a repository upload","original":"Okay then, can you upload HTML page to this repository?","corrected":"Okay, could you upload the HTML page to this repository?","example":"Could you commit the updated website to the main branch?","ko":"HTML 페이지를 이 저장소에 업로드해 주시겠어요?","exampleKo":"업데이트한 웹사이트를 main 브랜치에 커밋해 주시겠어요?","why":"Use 'the HTML page' when referring to a specific page. 'Could you' is a polite, natural request."},{"id":"legacy-011","date":null,"tags":["Articles","Pronouns"],"title":"Finding settings","original":"I couldn't find any GitHub Pages settings. Where can I find the setting page?","corrected":"I couldn't find the GitHub Pages settings. Where can I find them?","example":"I couldn't find the deployment settings. Could you show me where they are?","ko":"GitHub Pages 설정을 찾을 수 없었어요. 어디에 있나요?","exampleKo":"배포 설정을 찾을 수 없었어요. 어디에 있는지 알려주시겠어요?","why":"Use 'the' for a specific settings section. 'Them' refers naturally to the plural noun 'settings'."},{"id":"legacy-012","date":null,"tags":["Prepositions","Verb patterns"],"title":"Confirming deployment","original":"I checked the, I checked. I can access to the page.","corrected":"I checked, and I can access the page now.","example":"I opened the website on my phone, and everything seems to work.","ko":"확인해 봤는데 이제 페이지에 접속할 수 있어요.","exampleKo":"휴대폰으로 웹사이트를 열었는데 모두 잘 작동하는 것 같아요.","why":"'Access' is a transitive verb, so say 'access the page', not 'access to the page'. Remove repeated words in polished writing."},{"id":"legacy-013","date":null,"tags":["Natural phrasing","Useful expressions"],"title":"Expressing appreciation","original":"Thank you for your effort.","corrected":"Thanks for your help. I really appreciate it.","example":"I appreciate all the work you've put into this.","ko":"도와주셔서 감사합니다. 정말 감사해요.","exampleKo":"여기에 쏟아주신 노력에 감사해요.","why":"'Thank you for your effort' is grammatical, but 'Thanks for your help' or 'I appreciate your help' sounds warmer and more idiomatic."},{"id":"legacy-014","date":null,"tags":["Countable nouns","Quantifiers"],"title":"Requesting all corrections","original":"There are much more corrections in this session.","corrected":"There are many more corrections from this conversation.","example":"I think we've covered quite a few useful expressions that aren't on the page yet.","ko":"이 대화에는 더 많은 교정 문장이 있어요.","exampleKo":"아직 페이지에 없는 유용한 표현을 꽤 많이 다룬 것 같아요.","why":"Use 'many' with countable plural nouns such as 'corrections'; use 'much' with uncountable nouns."},{"id":"legacy-015","date":null,"tags":["Natural phrasing","Word choice"],"title":"Comparing recent and older content","original":"However I can find very recent conversations.","corrected":"However, I can only find corrections from our most recent conversations.","example":"Could you include the corrections from earlier in our conversation, too?","ko":"하지만 최근 대화의 교정 내용만 찾을 수 있어요.","exampleKo":"이전 대화에서 교정한 내용도 포함해 주시겠어요?","why":"'Only' communicates the missing older material. 'Corrections from conversations' is more precise than 'find conversations'."},{"id":"legacy-016","date":null,"tags":["Natural phrasing","Verb patterns"],"title":"Requesting a complete update","original":"I'd like you to update full corrections to the page.","corrected":"I'd like you to add all the corrections from our conversation to the page.","example":"Could you update the page to include our earlier corrections?","ko":"우리 대화에서 교정한 모든 문장을 페이지에 추가해 주세요.","exampleKo":"이전에 교정한 문장도 포함하도록 페이지를 업데이트해 주시겠어요?","why":"Use 'add ... to the page' for new entries. 'All the corrections' is more idiomatic than 'full corrections'."},{"id":"legacy-017","date":null,"tags":["Adverbs","Verb patterns"],"title":"Studying more efficiently","original":"In order to study more efficient, I want some features that hiding Korean or English.","corrected":"To study more efficiently, I'd like a feature that lets me hide either the Korean or the English text.","example":"It would help me practice if I could hide the answers until I'm ready.","ko":"더 효율적으로 공부하려고 한국어나 영어를 숨길 수 있는 기능이 필요해요.","exampleKo":"준비될 때까지 정답을 숨길 수 있다면 연습에 도움이 될 거예요.","why":"'Efficiently' is the adverb modifying 'study'. Say 'a feature that lets me hide' rather than 'features that hiding'."},{"id":"legacy-018","date":null,"tags":["Articles","Word forms"],"title":"Korean-only practice","original":"If I click show only Korean button, then I can only check Korean version, Korean translate.","corrected":"If I tap the 'Korean only' button, I want to see only the Korean translations.","example":"I'd like to use the Korean prompts to practice forming English sentences.","ko":"'한국어만 보기' 버튼을 누르면 한국어 번역만 보이게 하고 싶어요.","exampleKo":"한국어 문장을 보고 영어 문장을 만드는 연습을 하고 싶어요.","why":"Use 'tap' for mobile buttons. 'Korean translations' is more natural than 'Korean translate'."},{"id":"legacy-019","date":null,"tags":["Articles","Useful expressions"],"title":"Creating English from prompts","original":"And I can make English sentence with leading Korean.","corrected":"Then I can try to make an English sentence using the Korean translation as a prompt.","example":"I'll translate the Korean sentence into English before revealing the answer.","ko":"그러면 한국어 번역을 힌트로 영어 문장을 만들어 볼 수 있어요.","exampleKo":"정답을 보기 전에 한국어 문장을 영어로 번역해 볼게요.","why":"Say 'an English sentence' (article required) and 'using ... as a prompt' rather than 'with leading Korean'."},{"id":"legacy-020","date":null,"tags":["Articles","Prepositions"],"title":"Connecting GitHub","original":"I'm now having trouble connecting GitHub plugin in ChatGPT.","corrected":"I'm having trouble connecting the GitHub plugin to ChatGPT.","example":"I'm having trouble granting the app access to my repository.","ko":"ChatGPT에 GitHub 플러그인을 연결하는 데 문제가 있어요.","exampleKo":"앱에 저장소 접근 권한을 부여하는 데 문제가 있어요.","why":"'Connect A to B' is the standard pattern. 'The GitHub plugin' needs an article."},{"id":"legacy-021","date":null,"tags":["Useful expressions","Sentence structure"],"title":"Describing an error","original":"I clicked the connect button but I found that there's an error.","corrected":"I clicked the Connect button, but I got an error.","example":"I tried to authorize the integration, but GitHub returned an error.","ko":"연결 버튼을 눌렀는데 오류가 발생했어요.","exampleKo":"연동을 승인하려고 했지만 GitHub에서 오류가 발생했어요.","why":"'Got an error' is concise and idiomatic in software conversations. A comma separates the two clauses before 'but'."},{"id":"legacy-022","date":null,"tags":["Articles","Natural phrasing"],"title":"Enabling MFA","original":"Error message shows that it requires multi-factor authentication. How can I enable it?","corrected":"The error message says multi-factor authentication is required. How can I enable it?","example":"Do I need to enable two-factor authentication before connecting my account?","ko":"오류 메시지에 다중 인증이 필요하다고 나와요. 어떻게 활성화하나요?","exampleKo":"계정을 연결하기 전에 2단계 인증을 활성화해야 하나요?","why":"Use 'the error message' and 'says' for displayed messages. 'It' clearly refers to multi-factor authentication."},{"id":"legacy-025","date":null,"tags":["Prepositions","Verb patterns"],"title":"Discussing prior questions","original":"Just before I asked two questions regarding I'm connecting with GitHub and my personal project.","corrected":"I just asked two questions about connecting GitHub and working on my personal project.","example":"Could you correct the English I used in those questions?","ko":"방금 GitHub 연결과 개인 프로젝트 작업에 관해 두 가지 질문을 했어요.","exampleKo":"그 질문들에서 사용한 영어를 교정해 주시겠어요?","why":"'About' is more natural than 'regarding' here. After a preposition, use gerunds: 'connecting' and 'working'."},{"id":"2026-11-09-02","date":"2026-11-09","tags":["Natural phrasing","Verb patterns"],"title":"Combining sections","original":"I think we can also combine corrections and practice buttons together.","corrected":"I think we can combine the Corrections and Practice sections into one.","example":"Let's combine these two screens into a single page.","ko":"교정과 연습 섹션을 하나로 합칠 수 있을 것 같아요.","exampleKo":"이 두 화면을 하나의 페이지로 합쳐요.","why":"'Sections' describes the content more accurately than 'buttons'. 'Combine A and B into one' is a common pattern."},{"id":"2026-11-09-03","date":"2026-11-09","tags":["Useful expressions","Word choice"],"title":"Expanding cards","original":"I'd like the cards to be collapsed and uncollapsed with clicking.","corrected":"I'd like each card to expand and collapse when I tap it.","example":"Tap a card to reveal the answer, then tap again to hide it.","ko":"카드를 탭하면 펼쳐지고 다시 탭하면 접히게 하고 싶어요.","exampleKo":"카드를 탭해서 정답을 확인한 뒤 다시 탭해서 숨기세요.","why":"'Expand and collapse' are standard UI verbs. 'Tap' is more natural for touchscreens than 'click'."},{"id":"2026-11-09-04","date":"2026-11-09","tags":["Comparatives","Sentence structure"],"title":"Making the page simpler","original":"Plus, I I'd like you to make our page more simpler.","corrected":"I'd also like you to make the page simpler.","example":"Could we simplify the layout and remove unnecessary buttons?","ko":"페이지도 더 간단하게 만들어 주셨으면 해요.","exampleKo":"레이아웃을 단순화하고 불필요한 버튼을 없앨 수 있을까요?","why":"'Simpler' is already comparative, so 'more simpler' is redundant. 'I'd also like' is a smoother transition."},{"id":"2026-11-09-05","date":"2026-11-09","tags":["Natural phrasing","Verb patterns"],"title":"Organizing by date","original":"I'd like to manage this card to be managed by date so that I can check which date I added this card.","corrected":"I'd like to organize the cards by date so I can see when each one was added.","example":"Could you show the date each correction was added?","ko":"각 카드를 언제 추가했는지 알 수 있도록 날짜별로 정리하고 싶어요.","exampleKo":"각 교정 문장이 추가된 날짜를 보여주시겠어요?","why":"Use 'organize cards by date' rather than repeating 'manage'. 'When each one was added' is more idiomatic than 'which date I added this card'."},{"id":"2026-11-09-06","date":"2026-11-09","tags":["Prepositions","Useful expressions"],"title":"Adding tags","original":"I want to add some tags to the card so that I can search or merge them by the tag someday.","corrected":"I'd like to add tags to each card so I can search for or group them by tag later.","example":"Let's tag each sentence by topic so it's easier to review similar mistakes.","ko":"나중에 태그별로 검색하거나 묶을 수 있도록 각 카드에 태그를 추가하고 싶어요.","exampleKo":"비슷한 실수를 복습하기 쉽게 각 문장에 주제 태그를 달아요.","why":"'Group by tag' is clearer than 'merge by the tag' for organizing items. 'Search for' takes the preposition 'for'."},{"id":"2026-11-09-07","date":"2026-11-09","tags":["Plural nouns","Prepositions"],"title":"Keeping corrections updated","original":"Plus keep uploading the corrected sentence to the HTML page, including recent conversation.","corrected":"Please keep adding corrected sentences from our recent conversations to the HTML page.","example":"Whenever we finish a speaking session, please add the new corrections to the study page.","ko":"최근 대화에서 교정한 문장도 HTML 페이지에 계속 추가해 주세요.","exampleKo":"말하기 연습이 끝날 때마다 새로운 교정 문장을 학습 페이지에 추가해 주세요.","why":"Use plural 'corrected sentences' for multiple entries, and 'from our recent conversations' for their source."},{"id":"2026-11-09-08","date":"2026-11-09","tags":["Verb patterns","Natural phrasing"],"title":"Clarifying the purpose of tags","original":"I didn't mean the tags includes UI/UX grammar GitHub communication, this kind of things.","corrected":"I didn't mean tags like UI/UX, GitHub, or Communication. I meant tags related to English grammar and usage.","example":"I'd like to categorize the cards by the kinds of mistakes I make.","ko":"UI/UX나 GitHub 같은 태그가 아니라 영어 문법이나 표현에 관한 태그를 뜻했어요.","exampleKo":"제가 하는 실수의 유형별로 카드를 분류하고 싶어요.","why":"After 'mean', use a noun phrase such as 'tags like ...'. 'Tags related to' expresses the intended category clearly."},{"id":"2026-11-09-09","date":"2026-11-09","tags":["Passive voice","Verb patterns"],"title":"Removing unnecessary corrections","original":"Please remove it if it's the case.","corrected":"Please remove any cards where my original sentence was already natural.","example":"If a sentence doesn't need correcting, there's no need to add it to the deck.","ko":"제가 원래 말한 문장이 이미 자연스러웠던 카드는 삭제해 주세요.","exampleKo":"문장을 교정할 필요가 없다면 카드에 추가하지 않아도 돼요.","why":"'If it's the case' is vague here. 'Any cards where...' specifies exactly which entries should be removed."}];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tagSelect=document.getElementById('tag');[...new Set(cards.flatMap(c=>c.tags))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tagSelect.appendChild(o)});
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),tag=tagSelect.value,sort=document.getElementById('sort').value;const items=cards.filter(c=>(!tag||c.tags.includes(tag))&&[c.title,c.original,c.corrected,c.example,c.ko,c.exampleKo,c.why,...c.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>{const da=a.date||'',db=b.date||'';return sort==='newest'?db.localeCompare(da):da.localeCompare(db)});document.getElementById('count').textContent=items.length+' of '+cards.length+' corrections';document.getElementById('entries').innerHTML=items.map(c=>'<details class="entry"><summary><div class="front"><div class="meta"><span>'+escapeHtml(c.date||'Date unavailable')+'</span>'+c.tags.map(t=>'').join('')+'</div><div class="korean">'+escapeHtml(c.ko)+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="answer"><div class="field"><div class="label">Corrected English</div><div class="value corrected">'+escapeHtml(c.corrected)+'</div></div><div class="field"><div class="label">Your original sentence</div><div class="value original">'+escapeHtml(c.original)+'</div></div><div class="field"><div class="label">Additional example</div><div class="value">'+escapeHtml(c.example)+'</div><div class="example-ko">'+escapeHtml(c.exampleKo)+'</div></div><div class="explanation"><div class="label">Why?</div>'+escapeHtml(c.why)+'</div></div></details>').join('')||'<p class="empty">No matching sentences.</p>'}
document.getElementById('search').addEventListener('input',render);tagSelect.addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);render();
</script></body></html>
