<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>English Practice</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#202b3b}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:32px 18px 80px}h1{font-size:29px;letter-spacing:-.04em;margin:0 0 7px}header p{color:#6e7b8c;margin:0 0 23px;line-height:1.5}input,select{font:inherit;border:1px solid #dce3ed;background:white;border-radius:10px;padding:11px;color:#27313f}input{width:100%}select{font-size:13px;max-width:100%}input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a7bce8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.count{font-size:12px;color:#818894;margin:14px 0}.entry{background:white;border:1px solid #e0e7ef;border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 3px 12px #1a355006}.entry[open]{border-color:#adc5e5}.entry summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:19px;min-height:100px}.entry summary::-webkit-details-marker{display:none}.front{flex:1;min-width:0}.meta{font-size:11px;color:#8894a4;margin-bottom:10px}.korean{font-size:17px;font-weight:550;line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}.chevron{color:#7288a5;font-size:21px;transition:transform .18s}.entry[open] .chevron{transform:rotate(180deg)}.answer{padding:0 19px 20px;border-top:1px solid #edf0f4}.field{margin-top:18px}.label{font-size:11px;font-weight:750;letter-spacing:.06em;color:#6f829b;text-transform:uppercase;margin-bottom:7px}.value{font-size:15px;line-height:1.7;overflow-wrap:anywhere}.model{background:#f0f6ff;border-left:3px solid #4380d8;padding:13px 14px;border-radius:0 9px 9px 0;font-weight:550}.original{color:#777f8c}.corrected{font-weight:650;color:#1c654b}.note{font-size:14px;line-height:1.7;color:#5f6d7f}.explanation{margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4}.emphasis{background:#fff0bc;color:#81550b;border-radius:3px;padding:1px 3px;font-weight:750}.empty{color:#858c97;padding:30px 0}footer{font-size:12px;color:#9299a5;margin-top:30px}@media(max-width:420px){main{padding-top:24px}.entry summary{padding:16px}.answer{padding:0 16px 18px}}
</style></head><body><main><header><h1>English Practice</h1><p>Translate the two Korean sentences aloud, then tap the card to compare and learn.</p></header><input id="search" type="search" placeholder="Search sentences and grammar points…" aria-label="Search sentences"><div class="filters"><select id="tag" aria-label="Filter by grammar tag"><option value="">All grammar points</option></select><select id="sort" aria-label="Sort by date"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="count" class="count"></div><div id="entries"></div><footer>Older cards have no verified original added date. Tags are used for filtering, not shown on collapsed cards.</footer></main><script>
const cards=[{"id":"legacy-001","date":null,"tags":["Articles","Prepositions","Sentence linking","Useful expressions","Tenses"],"title":"Creating a repository","original":"All right, I made new repository to my account.","corrected":"All right, I've created a new repository under my account.","example":"I've just set up a new repository for my study notes. That said, I still need to figure out how to organize everything.","ko":"새 저장소를 제 계정에 만들었어요.","exampleKo":"방금 학습 노트를 위한 새 저장소를 만들었어요. 그렇긴 하지만 모든 것을 어떻게 정리할지는 아직 고민해야 해요.","why":"A singular countable noun needs an article: 'a new repository'. We usually say a repository is created 'under' an account. Practice note: Present perfect + present: use 'I've just set up' for a recent completed action and 'that said' to introduce a qualification.","linking":"That said"},{"id":"legacy-002","date":null,"tags":["Plural nouns","Sentence structure","Sentence linking","Useful expressions","Tenses"],"title":"Checking permissions","original":"I've updated permission, can you check again?","corrected":"I've updated the permissions. Could you check again?","example":"I've updated the permissions, but I'm not sure the change has taken effect. Would you mind checking the repository again?","ko":"권한을 업데이트했어요. 다시 확인해 주시겠어요?","exampleKo":"권한을 업데이트했지만 변경 사항이 적용됐는지 확실하지 않아요. 저장소를 다시 확인해 주시겠어요?","why":"Use plural 'permissions' for access settings. Separate the two independent clauses with a period rather than a comma. Practice note: Present perfect + present perfect: 'has taken effect' describes a change whose result matters now; 'Would you mind + -ing' makes a polite request.","linking":"Would you mind"},{"id":"legacy-003","date":null,"tags":["Articles","Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Checking account identity","original":"I don't think it's on right name. Can you check again?","corrected":"I don't think that's the correct username. Could you double-check which GitHub account is connected?","example":"I may have connected the wrong account earlier. In that case, we should verify the username before proceeding.","ko":"올바른 사용자 이름이 아닌 것 같아요. 연결된 계정을 다시 확인해 주시겠어요?","exampleKo":"아까 잘못된 계정을 연결했을지도 몰라요. 그렇다면 계속 진행하기 전에 사용자 이름을 확인해야 해요.","why":"'Username' precisely describes a GitHub login. 'Double-check' is natural when requesting verification. Practice note: Modal perfect 'may have + past participle' expresses uncertainty about a past action; 'in that case' introduces a consequence.","linking":"In that case"},{"id":"legacy-004","date":null,"tags":["Uncountable nouns","Prepositions","Sentence linking","Useful expressions","Tenses"],"title":"Sharing information","original":"How can I give you an information of my account?","corrected":"How can I share my account information with you?","example":"I was going to share my account details, but I wasn't sure what was needed. To be on the safe side, I'll only share the information that's necessary.","ko":"계정 정보를 어떻게 공유하면 될까요?","exampleKo":"계정 정보를 공유하려고 했지만 어떤 정보가 필요한지 확실하지 않았어요. 안전을 위해 필요한 정보만 공유할게요.","why":"'Information' is uncountable, so don't use 'an'. The natural expression is 'share information with someone'. Practice note: 'Was going to' describes a past intention; 'to be on the safe side' introduces a precaution.","linking":"To be on the safe side"},{"id":"legacy-005","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Discussing a project","original":"I'd like to discuss about my personal small project working in my codex.","corrected":"I'd like to talk about a small personal project I've been working on using Codex.","example":"I've been working on a small project in my spare time. For the time being, I'm focusing on getting the basic features right.","ko":"Codex로 진행 중인 작은 개인 프로젝트에 대해 이야기하고 싶어요.","exampleKo":"여가 시간에 작은 프로젝트를 진행해 왔어요. 당분간은 기본 기능을 제대로 만드는 데 집중하고 있어요.","why":"Use 'discuss a project' or 'talk about a project', not 'discuss about'. Say 'work on a project'. Practice note: Present perfect continuous emphasizes an activity continuing up to now; 'for the time being' means temporarily.","linking":"For the time being"},{"id":"legacy-006","date":null,"tags":["Prepositions","Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Storing source code","original":"The code is inside my laptop and my GitHub project.","corrected":"The source code is stored both on my laptop and in a GitHub repository.","example":"I had kept the code only on my laptop until I created a GitHub repository. Ever since then, I've been able to work on it from different devices.","ko":"소스 코드가 노트북과 GitHub 저장소 양쪽에 있어요.","exampleKo":"GitHub 저장소를 만들기 전까지는 코드를 노트북에만 보관했어요. 그 이후로 여러 기기에서 작업할 수 있게 되었어요.","why":"Files are 'on' a laptop, and a GitHub code project is more precisely called a 'repository'. Practice note: Past perfect marks an earlier state; present perfect describes the continuing result since that change.","linking":"Ever since then"},{"id":"legacy-007","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Developing on mobile","original":"Can you develop with just chatting in mobile?","corrected":"Can you help me develop the project just by chatting with me on my phone?","example":"I'll be commuting tomorrow, so I won't have my laptop with me. Even so, I'd like to make progress on the project using my phone.","ko":"휴대폰에서 채팅만으로 프로젝트 개발을 도와줄 수 있나요?","exampleKo":"내일 출퇴근할 때 노트북을 가지고 있지 않을 거예요. 그래도 휴대폰으로 프로젝트를 진행하고 싶어요.","why":"Say 'on my phone', not 'in mobile'. 'Help me develop the project' specifies the action. Practice note: Future continuous 'will be commuting' sets a future scene; 'even so' introduces a contrast.","linking":"Even so"},{"id":"legacy-008","date":null,"tags":["Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Choosing visibility","original":"I think public is also fine.","corrected":"I'm fine with making the repository public, too.","example":"I'm comfortable making the repository public. As long as no personal information is exposed, I don't see a problem with it.","ko":"저장소를 공개로 만들어도 괜찮아요.","exampleKo":"저장소를 공개해도 괜찮아요. 개인 정보가 노출되지 않는 한 문제없다고 생각해요.","why":"Your original sentence is understandable. Naming 'the repository' makes your meaning more specific. Practice note: 'As long as' introduces a necessary condition, and the present tense can express a future condition.","linking":"As long as"},{"id":"legacy-009","date":null,"tags":["Articles","Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Requesting study features","original":"You should show me an original sentence and corrected sentence and other example sentence.","corrected":"I'd like you to show my original sentence, a corrected version, and another example sentence.","example":"I'd like to compare my original sentence with a corrected version. That way, I can spot recurring mistakes instead of memorizing answers blindly.","ko":"제가 말한 원문, 교정된 문장, 추가 예문을 보여주세요.","exampleKo":"제가 말한 문장과 교정된 문장을 비교하고 싶어요. 그렇게 하면 무작정 정답을 외우는 대신 반복되는 실수를 알아챌 수 있어요.","why":"Use parallel noun phrases and articles: 'my original sentence, a corrected version, and another example sentence'. Practice note: 'That way' introduces the practical benefit of an action; 'instead of + -ing' contrasts approaches.","linking":"That way"},{"id":"legacy-010","date":null,"tags":["Articles","Polite requests","Sentence linking","Useful expressions","Tenses"],"title":"Requesting a repository upload","original":"Okay then, can you upload HTML page to this repository?","corrected":"Okay, could you upload the HTML page to this repository?","example":"Could you upload the page when you have a chance? Once it's live, I'll test it on my phone and report any problems.","ko":"HTML 페이지를 이 저장소에 업로드해 주시겠어요?","exampleKo":"시간 되실 때 페이지를 업로드해 주시겠어요? 공개되면 휴대폰에서 테스트하고 문제를 알려드릴게요.","why":"Use 'the HTML page' when referring to a specific page. 'Could you' is a polite, natural request. Practice note: 'When you have a chance' is a polite request; 'once' introduces a future event with present tense.","linking":"Once it's live"},{"id":"legacy-011","date":null,"tags":["Articles","Pronouns","Sentence linking","Useful expressions","Tenses"],"title":"Finding settings","original":"I couldn't find any GitHub Pages settings. Where can I find the setting page?","corrected":"I couldn't find the GitHub Pages settings. Where can I find them?","example":"I've been looking for the Pages settings for a while. As far as I can tell, they aren't visible in the mobile menu.","ko":"GitHub Pages 설정을 찾을 수 없었어요. 어디에 있나요?","exampleKo":"한동안 Pages 설정을 찾고 있었어요. 제가 확인한 바로는 모바일 메뉴에 보이지 않아요.","why":"Use 'the' for a specific settings section. 'Them' refers naturally to the plural noun 'settings'. Practice note: Present perfect continuous expresses an ongoing search; 'as far as I can tell' limits a claim to your current evidence.","linking":"As far as I can tell"},{"id":"legacy-012","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Confirming deployment","original":"I checked the, I checked. I can access to the page.","corrected":"I checked, and I can access the page now.","example":"The website is loading properly now. On top of that, the buttons seem to be working as expected.","ko":"확인해 봤는데 이제 페이지에 접속할 수 있어요.","exampleKo":"이제 웹사이트가 제대로 열리고 있어요. 게다가 버튼도 예상대로 작동하는 것 같아요.","why":"'Access' is a transitive verb, so say 'access the page', not 'access to the page'. Remove repeated words in polished writing. Practice note: Present continuous describes current behavior; 'on top of that' adds another positive point.","linking":"On top of that"},{"id":"legacy-013","date":null,"tags":["Natural phrasing","Useful expressions","Sentence linking","Tenses"],"title":"Expressing appreciation","original":"Thank you for your effort.","corrected":"Thanks for your help. I really appreciate it.","example":"You've helped me get the site up and running. I really appreciate it, especially since I was stuck earlier.","ko":"도와주셔서 감사합니다. 정말 감사해요.","exampleKo":"웹사이트가 작동하도록 도와주셨어요. 특히 아까 막혀 있었기 때문에 정말 감사해요.","why":"'Thank you for your effort' is grammatical, but 'Thanks for your help' or 'I appreciate your help' sounds warmer and more idiomatic. Practice note: Present perfect connects earlier help to the present result; 'get something up and running' means make it operational.","linking":"I really appreciate it"},{"id":"legacy-014","date":null,"tags":["Countable nouns","Quantifiers","Sentence linking","Useful expressions","Tenses"],"title":"Requesting all corrections","original":"There are much more corrections in this session.","corrected":"There are many more corrections from this conversation.","example":"We've covered far more corrections than I expected. Looking back, I can see that I often make mistakes with articles and prepositions.","ko":"이 대화에는 더 많은 교정 문장이 있어요.","exampleKo":"예상보다 훨씬 많은 교정을 다뤘어요. 돌이켜 보면 관사와 전치사에서 자주 실수한다는 걸 알 수 있어요.","why":"Use 'many' with countable plural nouns such as 'corrections'; use 'much' with uncountable nouns. Practice note: Present perfect summarizes accumulated experience; 'looking back' introduces reflection.","linking":"Looking back"},{"id":"legacy-015","date":null,"tags":["Natural phrasing","Word choice","Sentence linking","Useful expressions","Tenses"],"title":"Comparing recent and older content","original":"However I can find very recent conversations.","corrected":"However, I can only find corrections from our most recent conversations.","example":"I was reviewing the page yesterday when I noticed some older corrections were missing. At first, I thought the search feature was broken.","ko":"하지만 최근 대화의 교정 내용만 찾을 수 있어요.","exampleKo":"어제 페이지를 복습하다가 예전 교정 문장 몇 개가 빠진 걸 발견했어요. 처음에는 검색 기능이 고장 난 줄 알았어요.","why":"'Only' communicates the missing older material. 'Corrections from conversations' is more precise than 'find conversations'. Practice note: Past continuous + past simple describes an interrupted activity; 'at first' introduces an initial impression.","linking":"At first"},{"id":"legacy-016","date":null,"tags":["Natural phrasing","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Requesting a complete update","original":"I'd like you to update full corrections to the page.","corrected":"I'd like you to add all the corrections from our conversation to the page.","example":"I'd like to have all my corrections in one place. In the long run, that should make it easier to track my progress.","ko":"우리 대화에서 교정한 모든 문장을 페이지에 추가해 주세요.","exampleKo":"모든 교정 문장을 한곳에 모아두고 싶어요. 장기적으로는 그렇게 해야 학습 진도를 추적하기 쉬울 거예요.","why":"Use 'add ... to the page' for new entries. 'All the corrections' is more idiomatic than 'full corrections'. Practice note: 'In the long run' points to a long-term benefit; 'should' expresses an expected outcome.","linking":"In the long run"},{"id":"legacy-017","date":null,"tags":["Adverbs","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Studying more efficiently","original":"In order to study more efficient, I want some features that hiding Korean or English.","corrected":"To study more efficiently, I'd like a feature that lets me hide either the Korean or the English text.","example":"I've been trying to study more efficiently during my commute. Rather than reading the English first, I want to translate the Korean myself.","ko":"더 효율적으로 공부하려고 한국어나 영어를 숨길 수 있는 기능이 필요해요.","exampleKo":"출퇴근 시간에 더 효율적으로 공부하려고 노력해 왔어요. 영어를 먼저 읽기보다는 한국어를 직접 번역하고 싶어요.","why":"'Efficiently' is the adverb modifying 'study'. Say 'a feature that lets me hide' rather than 'features that hiding'. Practice note: Present perfect continuous describes an ongoing effort; 'rather than + -ing' presents a preferred alternative.","linking":"Rather than"},{"id":"legacy-018","date":null,"tags":["Articles","Word forms","Sentence linking","Useful expressions","Tenses"],"title":"Korean-only practice","original":"If I click show only Korean button, then I can only check Korean version, Korean translate.","corrected":"If I tap the 'Korean only' button, I want to see only the Korean translations.","example":"When I was using the Korean-only view, I had to switch modes to check my answers. That's why I wanted a simpler reveal-on-tap design.","ko":"'한국어만 보기' 버튼을 누르면 한국어 번역만 보이게 하고 싶어요.","exampleKo":"한국어만 보기 화면을 사용할 때 정답을 확인하려면 모드를 바꿔야 했어요. 그래서 탭해서 정답을 보여주는 더 간단한 디자인을 원했어요.","why":"Use 'tap' for mobile buttons. 'Korean translations' is more natural than 'Korean translate'. Practice note: Past continuous sets context; 'had to' expresses necessity, and 'that's why' introduces the reason for a decision.","linking":"That's why"},{"id":"legacy-019","date":null,"tags":["Articles","Useful expressions","Sentence linking","Tenses"],"title":"Creating English from prompts","original":"And I can make English sentence with leading Korean.","corrected":"Then I can try to make an English sentence using the Korean translation as a prompt.","example":"I used to read the English answer straight away. These days, I try to form the sentence myself before revealing it.","ko":"그러면 한국어 번역을 힌트로 영어 문장을 만들어 볼 수 있어요.","exampleKo":"예전에는 영어 정답을 바로 읽곤 했어요. 요즘은 정답을 보기 전에 문장을 직접 만들어 보려고 해요.","why":"Say 'an English sentence' (article required) and 'using ... as a prompt' rather than 'with leading Korean'. Practice note: 'Used to' contrasts a past habit with a current habit; 'these days' signals the present period.","linking":"These days"},{"id":"legacy-020","date":null,"tags":["Articles","Prepositions","Sentence linking","Useful expressions","Tenses"],"title":"Connecting GitHub","original":"I'm now having trouble connecting GitHub plugin in ChatGPT.","corrected":"I'm having trouble connecting the GitHub plugin to ChatGPT.","example":"I've been having trouble connecting the plugin. To make matters worse, the error message doesn't explain what went wrong.","ko":"ChatGPT에 GitHub 플러그인을 연결하는 데 문제가 있어요.","exampleKo":"플러그인을 연결하는 데 계속 문제가 있어요. 설상가상으로 오류 메시지에는 무엇이 잘못됐는지도 나와 있지 않아요.","why":"'Connect A to B' is the standard pattern. 'The GitHub plugin' needs an article. Practice note: Present perfect continuous describes an ongoing problem; 'to make matters worse' adds a further difficulty.","linking":"To make matters worse"},{"id":"legacy-021","date":null,"tags":["Useful expressions","Sentence structure","Sentence linking","Tenses"],"title":"Describing an error","original":"I clicked the connect button but I found that there's an error.","corrected":"I clicked the Connect button, but I got an error.","example":"I clicked Connect, but the request failed. It turns out I hadn't enabled the required authentication method.","ko":"연결 버튼을 눌렀는데 오류가 발생했어요.","exampleKo":"연결 버튼을 눌렀지만 요청이 실패했어요. 알고 보니 필요한 인증 방법을 활성화하지 않았더라고요.","why":"'Got an error' is concise and idiomatic in software conversations. A comma separates the two clauses before 'but'. Practice note: Past perfect 'hadn't enabled' identifies an earlier cause; 'it turns out' introduces a discovered fact.","linking":"It turns out"},{"id":"legacy-022","date":null,"tags":["Articles","Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Enabling MFA","original":"Error message shows that it requires multi-factor authentication. How can I enable it?","corrected":"The error message says multi-factor authentication is required. How can I enable it?","example":"The error said I needed multi-factor authentication. As soon as I enable it, I'll try connecting the account again.","ko":"오류 메시지에 다중 인증이 필요하다고 나와요. 어떻게 활성화하나요?","exampleKo":"오류 메시지에는 다중 인증이 필요하다고 나왔어요. 활성화하자마자 계정 연결을 다시 시도할게요.","why":"Use 'the error message' and 'says' for displayed messages. 'It' clearly refers to multi-factor authentication. Practice note: 'As soon as' introduces an immediate next step; use present tense in the time clause for a future event.","linking":"As soon as"},{"id":"legacy-025","date":null,"tags":["Prepositions","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Discussing prior questions","original":"Just before I asked two questions regarding I'm connecting with GitHub and my personal project.","corrected":"I just asked two questions about connecting GitHub and working on my personal project.","example":"I had asked two questions before I realized how awkward my wording sounded. From now on, I'll try to ask similar questions more clearly.","ko":"방금 GitHub 연결과 개인 프로젝트 작업에 관해 두 가지 질문을 했어요.","exampleKo":"표현이 얼마나 어색했는지 깨닫기 전에 질문 두 개를 했어요. 앞으로는 비슷한 질문을 더 명확하게 해 볼게요.","why":"'About' is more natural than 'regarding' here. After a preposition, use gerunds: 'connecting' and 'working'. Practice note: Past perfect places the questions before the realization; 'from now on' introduces a new intention.","linking":"From now on"},{"id":"2026-11-09-02","date":"2026-11-09","tags":["Natural phrasing","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Combining sections","original":"I think we can also combine corrections and practice buttons together.","corrected":"I think we can combine the Corrections and Practice sections into one.","example":"We could combine the two sections into one page. In doing so, we'd make the interface easier to navigate.","ko":"교정과 연습 섹션을 하나로 합칠 수 있을 것 같아요.","exampleKo":"두 섹션을 한 페이지로 합칠 수 있을 것 같아요. 그렇게 하면 인터페이스를 더 쉽게 이용할 수 있을 거예요.","why":"'Sections' describes the content more accurately than 'buttons'. 'Combine A and B into one' is a common pattern. Practice note: 'In doing so' refers back to the proposed action; 'would' describes its hypothetical result.","linking":"In doing so"},{"id":"2026-11-09-03","date":"2026-11-09","tags":["Useful expressions","Word choice","Sentence linking","Tenses"],"title":"Expanding cards","original":"I'd like the cards to be collapsed and uncollapsed with clicking.","corrected":"I'd like each card to expand and collapse when I tap it.","example":"I wanted the cards to open when I tapped them. In the same way, tapping them again should close them.","ko":"카드를 탭하면 펼쳐지고 다시 탭하면 접히게 하고 싶어요.","exampleKo":"카드를 탭하면 열리게 하고 싶었어요. 마찬가지로 다시 탭하면 닫혀야 해요.","why":"'Expand and collapse' are standard UI verbs. 'Tap' is more natural for touchscreens than 'click'. Practice note: 'In the same way' links two parallel actions; 'wanted' describes an earlier design preference.","linking":"In the same way"},{"id":"2026-11-09-04","date":"2026-11-09","tags":["Comparatives","Sentence structure","Sentence linking","Useful expressions","Tenses"],"title":"Making the page simpler","original":"Plus, I I'd like you to make our page more simpler.","corrected":"I'd also like you to make the page simpler.","example":"The page had become more complicated than I intended. That said, I still wanted to keep the features that actually helped me study.","ko":"페이지도 더 간단하게 만들어 주셨으면 해요.","exampleKo":"페이지가 의도했던 것보다 복잡해졌어요. 그렇긴 하지만 공부에 실제로 도움이 되는 기능은 유지하고 싶었어요.","why":"'Simpler' is already comparative, so 'more simpler' is redundant. 'I'd also like' is a smoother transition. Practice note: Past perfect 'had become' describes a state reached before a past decision; 'that said' adds a qualification.","linking":"That said"},{"id":"2026-11-09-05","date":"2026-11-09","tags":["Natural phrasing","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Organizing by date","original":"I'd like to manage this card to be managed by date so that I can check which date I added this card.","corrected":"I'd like to organize the cards by date so I can see when each one was added.","example":"I want to know when each card was added. Over time, I'll be able to see which kinds of mistakes I've been making most often.","ko":"각 카드를 언제 추가했는지 알 수 있도록 날짜별로 정리하고 싶어요.","exampleKo":"각 카드가 언제 추가되었는지 알고 싶어요. 시간이 지나면 어떤 실수를 가장 자주 해 왔는지 알 수 있을 거예요.","why":"Use 'organize cards by date' rather than repeating 'manage'. 'When each one was added' is more idiomatic than 'which date I added this card'. Practice note: Future ability 'will be able to' describes a later benefit; present perfect continuous tracks repeated mistakes up to that point.","linking":"Over time"},{"id":"2026-11-09-06","date":"2026-11-09","tags":["Prepositions","Useful expressions","Sentence linking","Tenses"],"title":"Adding tags","original":"I want to add some tags to the card so that I can search or merge them by the tag someday.","corrected":"I'd like to add tags to each card so I can search for or group them by tag later.","example":"I kept making the same preposition mistake, so I added a grammar tag. From then on, I could find similar examples much more easily.","ko":"나중에 태그별로 검색하거나 묶을 수 있도록 각 카드에 태그를 추가하고 싶어요.","exampleKo":"같은 전치사 실수를 계속해서 문법 태그를 추가했어요. 그때부터 비슷한 예문을 훨씬 쉽게 찾을 수 있었어요.","why":"'Group by tag' is clearer than 'merge by the tag' for organizing items. 'Search for' takes the preposition 'for'. Practice note: 'Kept + -ing' expresses repetition; 'from then on' marks a continuing change from a past point.","linking":"From then on"},{"id":"2026-11-09-07","date":"2026-11-09","tags":["Plural nouns","Prepositions","Sentence linking","Useful expressions","Tenses"],"title":"Keeping corrections updated","original":"Plus keep uploading the corrected sentence to the HTML page, including recent conversation.","corrected":"Please keep adding corrected sentences from our recent conversations to the HTML page.","example":"I'd like new corrections to appear on the page after each session. Ideally, I won't have to copy them over by hand.","ko":"최근 대화에서 교정한 문장도 HTML 페이지에 계속 추가해 주세요.","exampleKo":"매번 연습이 끝나면 새 교정 문장이 페이지에 나타났으면 해요. 가능하면 직접 복사해 옮길 필요가 없었으면 좋겠어요.","why":"Use plural 'corrected sentences' for multiple entries, and 'from our recent conversations' for their source. Practice note: 'Ideally' introduces a preferred outcome; 'won't have to' expresses the absence of a future obligation.","linking":"Ideally"},{"id":"2026-11-09-08","date":"2026-11-09","tags":["Verb patterns","Natural phrasing","Sentence linking","Useful expressions","Tenses"],"title":"Clarifying the purpose of tags","original":"I didn't mean the tags includes UI/UX grammar GitHub communication, this kind of things.","corrected":"I didn't mean tags like UI/UX, GitHub, or Communication. I meant tags related to English grammar and usage.","example":"I wasn't asking for tags about software topics. What I had in mind was a way to group mistakes by grammar point.","ko":"UI/UX나 GitHub 같은 태그가 아니라 영어 문법이나 표현에 관한 태그를 뜻했어요.","exampleKo":"소프트웨어 주제에 관한 태그를 요청한 게 아니었어요. 제가 염두에 둔 것은 문법 항목별로 실수를 묶는 방법이었어요.","why":"After 'mean', use a noun phrase such as 'tags like ...'. 'Tags related to' expresses the intended category clearly. Practice note: 'What I had in mind' clarifies an earlier intention; past perfect 'had in mind' refers to the intention already formed.","linking":"What I had in mind"},{"id":"2026-11-09-09","date":"2026-11-09","tags":["Passive voice","Verb patterns","Sentence linking","Useful expressions","Tenses"],"title":"Removing unnecessary corrections","original":"Please remove it if it's the case.","corrected":"Please remove any cards where my original sentence was already natural.","example":"Some of my original sentences were already natural. In that case, there was no point in adding another practice card.","ko":"제가 원래 말한 문장이 이미 자연스러웠던 카드는 삭제해 주세요.","exampleKo":"제가 원래 말한 문장 중 일부는 이미 자연스러웠어요. 그런 경우에는 연습 카드를 하나 더 추가할 필요가 없었어요.","why":"'If it's the case' is vague here. 'Any cards where...' specifies exactly which entries should be removed. Practice note: 'In that case' introduces a consequence; 'there's no point in + -ing' is a useful everyday pattern.","linking":"In that case"}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function highlighted(text,phrase){const i=text.toLowerCase().indexOf(phrase.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark class="emphasis">'+esc(text.slice(i,i+phrase.length))+'</mark>'+esc(text.slice(i+phrase.length))}
const tagSelect=document.getElementById('tag');[...new Set(cards.flatMap(c=>c.tags))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tagSelect.appendChild(o)});
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),tag=tagSelect.value,sort=document.getElementById('sort').value;const items=cards.filter(c=>(!tag||c.tags.includes(tag))&&[c.title,c.original,c.corrected,c.example,c.exampleKo,c.why,...c.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>sort==='newest'?(b.date||'').localeCompare(a.date||''):(a.date||'').localeCompare(b.date||''));document.getElementById('count').textContent=items.length+' of '+cards.length+' practice cards';document.getElementById('entries').innerHTML=items.map(c=>'<details class="entry"><summary><div class="front"><div class="meta">'+esc(c.date||'Date unavailable')+'</div><div class="korean">'+esc(c.exampleKo)+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="answer"><div class="field"><div class="label">Two-sentence English practice</div><div class="value model">'+highlighted(c.example,c.linking)+'</div></div><div class="field"><div class="label">Your actual sentence</div><div class="value original">'+esc(c.original)+'</div></div><div class="field"><div class="label">Corrected sentence</div><div class="value corrected">'+esc(c.corrected)+'</div></div><div class="explanation"><div class="label">What to learn</div><div class="note">'+highlighted(c.why,c.linking)+'</div></div></div></details>').join('')||'<p class="empty">No matching sentences.</p>'}
document.getElementById('search').addEventListener('input',render);tagSelect.addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);render();
</script></body></html>
